<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="VisOKR：融合 Vis 的任务推进体验与 OKR 度量节奏分析——摘要、目标库、任务、我的，GitHub 多端同步。" />
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101322" media="(prefers-color-scheme: dark)" />
<title>VisOKR · 我的目标管理</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
/* ============ 主题（Vis 视觉基调：浅灰底 + 白卡 + 紫/蓝） ============ */
:root{
  --bg:#f2f3f7; --card:#ffffff; --card2:#f6f7fb; --ink:#111214; --muted:#8a8f9e;
  --line:#ececf1; --accent:#2f6bff; --purple:#8a8af0; --purple2:#7b7bea; --purple-ink:#6366f1;
  --red:#e5484d; --redbg:#fdecec; --ok:#2f9e63; --okbg:#e3f4ea; --warn:#c77701; --warnbg:#fdf1dd;
  --segbg:#e9eaf0; --chipbg:#eef0f6; --shadow:0 2px 12px rgba(25,30,60,.06); --shadow2:0 10px 30px rgba(25,30,60,.18);
  --radius:20px;
}
html[data-theme="dark"]{
  --bg:#0f1117; --card:#1a1c24; --card2:#22242e; --ink:#f2f3f7; --muted:#8f94a3;
  --line:#2a2d38; --accent:#5b8bff; --purple:#6f6fd8; --purple2:#5f5fc8; --purple-ink:#a5a8ff;
  --red:#ff6369; --redbg:#3a2226; --ok:#4ecb8a; --okbg:#16321f; --warn:#e0a94b; --warnbg:#33290f;
  --segbg:#262935; --chipbg:#242734; --shadow:0 2px 12px rgba(0,0,0,.3); --shadow2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
#app{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.page-title{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:18px 2px 16px;display:flex;align-items:center}
.page-title .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}.bold{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.backbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;color:var(--ink);margin-right:12px}
.circbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:15px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--chipbg);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--redbg);color:var(--red)}
.chip.done{background:var(--chipbg);color:var(--purple-ink)}

/* ============ 底部 Tab ============ */
#tabbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:4px;background:var(--card);border-radius:28px;box-shadow:var(--shadow2);padding:6px;width:min(430px,94vw)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border-radius:22px;font-size:11px;color:var(--ink);transition:.18s}
#tabbar button .ic{font-size:20px;line-height:1.1;filter:grayscale(1) brightness(.6)}
#tabbar button.on{background:var(--segbg);color:var(--accent);font-weight:700}
#tabbar button.on .ic{filter:none}

/* ============ 摘要 ============ */
.stats{display:flex;margin:0 4px 14px}
.stat{flex:1;text-align:center;position:relative;padding:4px 0}
.stat+.stat::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:var(--line)}
.stat .n{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.stat .n .em{font-size:17px}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.wk{position:relative;overflow:hidden}
.wk .mo{font-size:16px;font-weight:800;text-align:center;margin-bottom:8px}
.wk .days{display:grid;grid-template-columns:repeat(9,1fr);position:relative;z-index:1}
.wk .d{text-align:center;font-size:14px;font-weight:600;padding:4px 0}
.wk .d.today{color:var(--red);background:var(--redbg);border-radius:10px;font-size:12px;font-weight:700}
.wk .todayline{position:absolute;top:34px;bottom:6px;width:2px;background:var(--red);z-index:2;border-radius:2px}
.wk .bars{position:relative;margin-top:8px;display:flex;flex-direction:column;gap:10px;min-height:34px}
.gbar{height:34px;border-radius:10px;background:linear-gradient(90deg,var(--purple),var(--purple2));color:#fff;
  display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;box-shadow:var(--shadow);
  touch-action:none;user-select:none;position:relative}
.gbar.dragging{cursor:grabbing;opacity:.9;box-shadow:var(--shadow2);z-index:5}
.gbar .hint{margin-left:auto;font-size:10px;opacity:.75;padding-left:8px}
/* 季度节奏卡 */
.qcard{display:flex;gap:16px;align-items:center}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;text-align:center;line-height:1.1}
.qmeta{flex:1;min-width:0}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--purple2));transition:width .4s}
.pbar.time>i{background:linear-gradient(90deg,#b9bec9,#8d93ab)}
.prow{display:flex;align-items:center;gap:10px}
.pct{font-size:13px;color:var(--muted);min-width:34px;text-align:right}
.lab{width:56px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.lab::before{content:"";width:8px;height:8px;border-radius:2.5px;background:#9aa0b4;flex:none}
.lab.okr{color:var(--purple-ink);font-weight:700}
.lab.okr::before{background:linear-gradient(135deg,var(--purple),var(--purple-ink))}
.chev{width:30px;height:30px;border-radius:9px;background:var(--chipbg);display:grid;place-items:center;font-size:13px;color:var(--accent)}
.riskrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.riskrow:last-child{border:none}
.sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:430px){.sg-grid{grid-template-columns:1fr}}
.sg{background:linear-gradient(160deg,var(--purple),var(--purple2));border-radius:16px;padding:14px;color:#fff;min-height:118px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow);position:relative}
.sg .t{font-size:15px;font-weight:700;line-height:1.35;flex:1;margin-top:14px}
.sg .b{display:flex;align-items:center;gap:6px;margin-top:10px}
.sg .cnt{font-size:14px;font-weight:700;flex:1;text-align:center;margin-right:6px}
.sg .plus{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff;flex:none}
.sg .plus:active{background:rgba(255,255,255,.25)}
.sg .sgauto{font-size:10.5px;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 9px;font-weight:700;white-space:nowrap;flex:none}
.type-notes{margin-top:8px;font-size:12px;line-height:1.75;color:var(--muted)}
.type-notes div{padding:2px 8px;border-radius:8px;border-left:2.5px solid transparent}
.type-notes div.on{color:var(--ink);background:var(--chipbg);border-left-color:var(--purple)}
.type-notes b{font-weight:700}
.emo-ring{position:relative;display:inline-grid;place-items:center;flex:none}
.emo-ring .emo{position:absolute;line-height:1}
.side-sep,.side-gh,.side-gi{display:none}
@media(min-width:1024px){
  #tabbar{overflow-y:auto}
  .side-sep{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:18px 16px 6px}
  .side-gh{display:block;font-size:11px;color:var(--muted);margin:10px 16px 4px;font-weight:700}
  .side-gi{display:flex;align-items:center;gap:8px;padding:6px 12px;margin:1px 8px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;min-width:0}
  .side-gi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-gi:hover{background:var(--chipbg)}
  .side-gi.on{background:var(--chipbg);color:var(--accent)}
}
.ckrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:700;cursor:pointer}
.ckrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--purple);flex:none}
.sg .sgfill{position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;background:rgba(0,0,0,.24);transition:width .45s ease;pointer-events:none;border-radius:16px 0 0 16px}
.sg .t,.sg .b{position:relative;z-index:1}
.sg .sgp,.sg .mini{z-index:1}
.sg .mini{position:absolute;top:8px;right:10px;font-size:11px;opacity:.85}
.sg .sgp{position:absolute;top:8px;left:12px;font-size:10.5px;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 6px}
.goal-card .gc-head{cursor:pointer}
.goal-card .date{font-size:12.5px;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.goal-card .t{overflow-wrap:anywhere}
.sg .t{overflow-wrap:anywhere}

/* ============ 目标库 ============ */
.grouplist .grow{display:flex;align-items:center;gap:10px;padding:15px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;font-size:16px;font-weight:700;cursor:pointer}
.grouplist .grow .cnt{color:var(--muted);font-weight:400;font-size:15px;flex:none}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grouplist .grow .gt{color:var(--muted);font-size:13px}
.sect{font-size:17px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px 18px;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{font-size:16px;font-weight:700;position:relative;padding:6px 2px 12px;white-space:nowrap}
.tabs button .c{color:var(--muted);font-weight:600;font-size:14px}
.tabs button.on{color:var(--accent)}
.tabs button.on .c{color:var(--accent)}
.tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:22px;height:4px;border-radius:4px;background:var(--accent)}

/* ============ 任务 ============ */
.seg{display:flex;background:var(--segbg);border-radius:14px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(20,25,50,.12);font-weight:700}
.tgroup{font-size:17px;font-weight:800;margin:16px 4px 10px}
.tgroup.overdue{color:var(--red)}
.task{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.task .cb{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--purple);flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:14px;transition:.15s}
.task.done .cb{background:var(--purple);border-color:var(--purple)}
.task .bd{flex:1;min-width:0}
.task .tt{font-size:16.5px;font-weight:700;color:var(--purple-ink);word-break:break-word}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.task .meta.overdue{color:var(--red);font-weight:700}
.task .link{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.task .imp{color:var(--purple-ink);background:var(--chipbg);border-radius:6px;padding:1px 6px;font-weight:700;display:inline-flex;gap:3px;align-items:center}
.task .star{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:24px}
.task .star .badge{position:absolute;bottom:0;right:0;background:var(--purple);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1.5px 6px;border:2px solid var(--card)}
.task.todaydone .tt{opacity:.92}
.task .rep{font-size:10.5px;background:var(--chipbg);color:var(--purple-ink);border-radius:6px;padding:1.5px 7px;margin-left:8px;font-weight:700;white-space:nowrap;vertical-align:2px}
.fab{position:fixed;right:max(20px,calc(50% - 320px + 20px));bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:50%;background:var(--card);color:var(--accent);font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:var(--shadow2)}
.fab:active{transform:scale(.94)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-align:center;padding:10px 0 12px;cursor:pointer}
.day .w{font-size:12px;color:var(--muted)}
.day .n{font-size:17px;font-weight:800;margin-top:3px;width:30px;height:30px;line-height:30px;border-radius:50%;display:inline-block}
.day.on{background:var(--chipbg)}
.day.on .w{color:var(--accent);font-weight:700}
.day.on .n{background:var(--accent);color:#fff}
.day .has{width:4px;height:4px;border-radius:50%;background:var(--purple);display:inline-block;margin:2px auto 0}

/* ============ 趋势/热力看板 ============ */
.dash2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.dash2{grid-template-columns:1fr}}
.dash2 h4{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.dash2 h4 .sub{margin-left:auto;font-weight:400;font-size:11px;color:var(--muted)}
.trend-wrap{position:relative}
.trend-wrap svg{width:100%;height:auto;display:block}
.trend-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.heatgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;max-width:320px}
.heatcell{width:12px;height:12px;border-radius:4px;background:var(--chipbg)}
.color-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.color-legend .lg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.streak{display:inline-flex;align-items:center;gap:4px;background:var(--warnbg);color:var(--warn);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800}
.motto{font-size:15px;font-style:italic;font-weight:600;line-height:1.7;cursor:pointer;color:var(--ink);
  background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 11%,var(--card)),var(--card) 60%);border-left:3px solid var(--purple)}
.motto .qm{color:var(--purple);font-size:21px;font-weight:800;font-style:normal;margin:0 5px;vertical-align:-3px}
.iconbtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--chipbg)}
.motto .muted{font-style:normal;font-size:13px}
.tcount{display:inline-block;background:var(--chipbg);color:var(--purple-ink);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800;margin-right:8px;font-style:normal;vertical-align:2px}

/* ============ v4.1 日历与日期选择器 ============ */
.dpf{padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2);font-size:15px;cursor:pointer;user-select:none}
.dpf:active{border-color:var(--purple)}
.dpf.empty{color:var(--muted)}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{position:relative;padding:7px 0 13px;text-align:center;border-radius:11px;font-size:14px;cursor:pointer;font-weight:600}
.cd.out{opacity:.28}
.cd.on{background:var(--accent);color:#fff}
.cd.now{box-shadow:inset 0 0 0 1.5px var(--red)}
.dotslot{display:block;height:7px;line-height:7px}
.cd .dotslot i,.day .dotslot i{display:inline-block;width:5px;height:5px;border-radius:50%}
.dotact{background:var(--accent)}
.dotfin{background:var(--ok)}
.dotmix{background:linear-gradient(90deg,var(--ok) 50%,var(--accent) 50%)}
.cd.on .dotact,.cd.on .dotfin,.cd.on .dotmix{background:rgba(255,255,255,.9)}
.day .dotslot{display:block;height:7px;text-align:center}
.day.now .n{box-shadow:inset 0 0 0 1.6px var(--red)}
.ymonths{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.ymonths{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.ymonths{grid-template-columns:repeat(2,1fr)}}
.ymt{font-size:12px;font-weight:700;margin-bottom:3px}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd{position:relative;aspect-ratio:1;border-radius:3px;cursor:pointer;background:transparent}
.yd i{position:absolute;inset:14%;border-radius:2px}
.yd .sa{background:var(--purple)}
.yd .sf{background:var(--ok)}
.yd .s0{background:var(--chipbg)}
.yd.out{opacity:.22}
.yd.on{outline:2px solid var(--accent)}
.task.mini{padding:9px 14px;opacity:.72;margin-bottom:8px}
.task.mini .tt{font-size:14px;color:var(--muted)}
.cb.ghost{border-color:var(--line);background:transparent}
.cbring-wrap{position:relative;width:34px;height:34px;flex:none;display:inline-grid;place-items:center}
.cbring-wrap .cb{margin-top:0}
.cbring{position:absolute;inset:0;pointer-events:none}

/* ============ 我的 ============ */
.vip{background:linear-gradient(120deg,#17181d,#2b2d3a);border-radius:22px;color:#fff;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.vip h4{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.vip .tag{background:#fff;color:#d9480f;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.vip p{margin:10px 0 0;font-size:13px;color:#9a9db0}
.vip .crown{position:absolute;right:14px;top:14px;font-size:52px;opacity:.18}
.setlist{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;padding:16px;font-size:15.5px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.setlist .setrow:last-child{border-bottom:none}
.setrow .ic{font-size:19px;width:26px;text-align:center}
.setrow .arr{margin-left:auto;color:#c3c7d1;font-size:15px}
.setrow.danger{color:var(--red)}

/* ============ 复盘/时间线 ============ */
.tl-item{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tl-item:last-child{border:none}
.tl-date{flex:none;width:76px;font-size:12px;color:var(--muted);padding-top:2px;line-height:1.6}
.tl-body{flex:1;min-width:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.conf-hi{color:var(--ok)}.conf-mid{color:var(--warn)}.conf-lo{color:var(--red)}

/* ============ 弹层 ============ */
#overlay{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,12,20,.55);backdrop-filter:blur(2px);align-items:flex-end;justify-content:center}
@media(min-width:720px){#overlay{align-items:center}}
#overlay.open{display:flex}

  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#8a8af0"/><stop offset="1" style="stop-color:#6366f1"/></linearGradient>

<script>
"use strict";
/* =============================================================
   VisOKR v3 · Vis 的任务推进体验 + OKR 度量节奏分析
   模型：目标 Goal → 拆分目标 Subgoal(计数/递减/百分比/是否)
        ← 任务 Task(完成自动推进) + 复盘 Record(信心度+快照)
   存储：localStorage + GitHub Contents API 多端同步（可选）
   ============================================================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const now=()=>Date.now();
const dstr=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const pdate=s=>{if(!s)return null;const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const REPEATS={none:"单次",weekly:"每周",biweekly:"每两周",monthly:"每月",yearly:"每年"};
const METRICS={count:{label:"计数",icon:"⭐",defInc:1},percent:{label:"百分比",icon:"%",defInc:5},bool:{label:"是否",icon:"✓",defInc:1}};
/* ---------- 周期配额任务 ---------- */
function isCyc(t){return t.cycle&&t.cycle!=="none";}
function taskQuota(t){return Math.max(1,Number(t.quota)||1);}
function taskMarks(t){return Array.isArray(t.marks)?t.marks:[];}
function curMarks(t){return taskMarks(t).filter(m=>t.cycleStart&&markDay(m)>=t.cycleStart);}
function cycEnd(start,cycle){const d=pdate(start)||new Date();
  if(cycle==="weekly")d.setDate(d.getDate()+7);
  else if(cycle==="biweekly")d.setDate(d.getDate()+14);
  else{const day=d.getDate();d.setDate(1);
    if(cycle==="monthly")d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));/* 月末钳制：1/31→2/28 */}
  return dstr(d);}
function rollTask(t){if(!isCyc(t)||!t.cycleStart)return false;let ch=false,guard=0;
  while(cycEnd(t.cycleStart,t.cycle)<=dstr()&&guard++<500){t.cycleStart=cycEnd(t.cycleStart,t.cycle);ch=true;}
  return ch;}
function rollAll(){let ch=false;Object.values(S.tasks).forEach(t=>{if(!t.deleted&&rollTask(t))ch=true;});
  if(ch){S.meta.updatedAt=now();try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){}queuePush();}}
function cycMet(t){return isCyc(t)&&curMarks(t).length>=taskQuota(t);}
function taskActive(t){return isCyc(t)?!cycMet(t):!t.done;}
function taskDoneAt(t){if(isCyc(t)){const ms=curMarks(t);return cycMet(t)&&ms.length?ms[ms.length-1].at:0;}return t.doneAt||0;}
function taskCovers(t,ds){if(isCyc(t))return !!t.cycleStart&&ds>=t.cycleStart&&ds<cycEnd(t.cycleStart,t.cycle);return t.due===ds;}
function taskMetric(t){return t.metric||"count";}
/* ---------- 任务驱动型拆分目标：当前值由关联任务自动计算 ---------- */
function linkedTasks(sgid){return Object.values(S.tasks).filter(t=>!t.deleted&&t.subgoalId===sgid);}
function sgDriven(s){const ty=sgType(s);return s.auto===true&&(ty==="count"||ty==="percent"||ty==="bool");}
function winCount(t){ /* 从窗口起点至今已开启的周期数（含当前） */
  const st=t.origStart||t.cycleStart;if(!st)return 1;
  const today=dstr();let n=1,cs=st;
  while(cycEnd(cs,t.cycle)<=today&&n<700){cs=cycEnd(cs,t.cycle);n++;}
  return n;}
function taskExpected(t){const inc=Number(t.inc)||1;
  if(isCyc(t))return taskQuota(t)*winCount(t)*inc;
  return (t.due&&t.due<=dstr())?inc:0;}
function taskAchieved(t){const inc=Number(t.inc)||1;
  if(isCyc(t))return (Number(t.doneTotal)||taskMarks(t).length)*inc;
  return t.done?inc:0;}
function sgDerived(s){ /* 推导出的"当前值"：count=推进量合计；percent/bool=推荐量达成率% */
  const ts=linkedTasks(s.id);
  const ach=ts.reduce((a,t)=>a+taskAchieved(t),0);
  if(sgType(s)==="count")return ach;
  const exp=ts.reduce((a,t)=>a+taskExpected(t),0);
  const pct=exp>0?clamp(ach/exp*100,0,100):0;
  if(sgType(s)==="bool")return pct>=99.5?1:0;
  return pct;}
function sgCur(s){return sgDriven(s)?sgDerived(s):Number(s.current||0);}
const OBJ_COLORS=["#7b7bea","#e8590c","#1c7ed6","#2f9e63","#e03131","#e6a700","#0ca678","#d6336c","#5f3dc4"];
const GROUP_ICONS=["📁","","💪","📚","💰","🎨","🌙","🔥","🏠","💼","🎮","✈️","🎸","🥗"];
const GOAL_ICONS=["\u{1F3AF}","\u{1F4BC}","\u{1F680}","\u{1F4AA}","\u{1F4B0}","\u{1F4DA}","\u{1F3A8}","\u{1F319}","\u{1F525}","\u{1F3E0}","\u{1F9ED}","\u{2708}\u{FE0F}","\u{1F9E0}","\u{1F4BB}","\u{1F3B8}"];
function goalEmoji(g){return g.emoji||"\u{1F3AF}";}
/* emoji + 外侧进度环（Vis 侧栏同款） */
function emojiRing(g,size){size=size||50;
  const p=clamp(goalProg(g.id),0,100),w=Math.max(3,size*0.10),r=(size-w)/2,c=2*Math.PI*r,col=goalColor(g);
  return '<span class="emo-ring" style="width:'+size+'px;height:'+size+'px">'+
   '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:var(--chipbg)" stroke-width="'+w+'"/>'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+(c*p/100).toFixed(1)+' '+c.toFixed(1)+'"/>'+
   '</svg><span class="emo" style="font-size:'+Math.round(size*0.42)+'px">'+goalEmoji(g)+'</span></span>';}
/* 横屏侧栏：目标直达列表（按目标组分组） */
function sideGoalsHtml(){
  const gs=Object.values(S.goals).filter(g=>!g.deleted&&!g.archived).sort((a,b)=>goalStatus(a)==="进行中"?-1:1);
  if(!gs.length)return "";
  const byG={},order=[];
  gs.forEach(g=>{const gr=g.groupId&&S.groups[g.groupId]&&!S.groups[g.groupId].deleted?g.groupId:"_";
    if(!byG[gr]){byG[gr]=[];order.push(gr);}byG[gr].push(g);});
  let h='<div class="side-sep">目标</div>';
  order.forEach(gr=>{
    h+=gr!=="_"?'<div class="side-gh">'+(S.groups[gr].icon||"\u{1F4C1}")+' '+esc(S.groups[gr].name)+'</div>':(order.length>1?'<div class="side-gh">\u{1F3AF} 未分组</div>':"");
    byG[gr].forEach(g=>{const on=UI.view&&UI.view.name==="goal"&&UI.view.id===g.id;
      h+='<div class="side-gi'+(on?" on":"")+'" data-side-goal="'+g.id+'" title="'+esc(g.title)+'">'+emojiRing(g,26)+'<span>'+esc(g.title)+'</span></div>';});});
  return h;}
function nextDue(due,rep){const d=pdate(due);if(!d||!rep||rep==="none")return due;
  if(rep==="weekly")d.setDate(d.getDate()+7);
  else if(rep==="biweekly")d.setDate(d.getDate()+14);
  else{const day=d.getDate();d.setDate(1);
    if(rep==="monthly")d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));/* 月末钳制：1/31+1月=2/28 */}
  return dstr(d);}
const fmtNum=v=>(Math.round(v*100)/100).toString();
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
function ago(ts){const m=Math.floor((now()-ts)/60000);if(m<1)return"刚刚";if(m<60)return m+" 分钟前";const h=Math.floor(m/60);if(h<24)return h+" 小时前";const d=Math.floor(h/24);return d<30?d+" 天前":new Date(ts).toLocaleDateString("zh-CN");}
function toast(msg,ms){const t=$("#toast");const d=document.createElement("div");d.textContent=msg;t.appendChild(d);setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity="0";setTimeout(()=>d.remove(),320)},ms||2000);}
function relDay(ds){const t=dstr(),y=dstr(new Date(now()+864e5)),p=dstr(new Date(now()-864e5));
  return ds===t?"今天":ds===y?"明天":ds===p?"昨天":ds.slice(5).replace("-","/");}

/* ---------- v4.1：页签记忆 / 周一日历 / 日期选择器 ---------- */
function viewStack(){if(!UI.tabViews)UI.tabViews={};
  const cur=UI.tabViews[UI.tab];
  if(!Array.isArray(cur))UI.tabViews[UI.tab]=cur?[cur]:[];
  return UI.tabViews[UI.tab];}
function syncStack(){const st=viewStack();
  if(!UI.view){UI.tabViews[UI.tab]=[];return;}
  const i=st.findIndex(v=>v.name===UI.view.name&&v.id===UI.view.id);
  if(i>=0)UI.tabViews[UI.tab]=st.slice(0,i+1);
  else st.push(Object.assign({},UI.view));}
function pushView(v){UI.view=v;syncStack();saveUI();}
function popView(){const st=viewStack();if(st.length)st.pop();
  UI.view=st.length?st[st.length-1]:null;saveUI();render();
  requestAnimationFrame(()=>window.scrollTo(0,(viewStack().slice(-1)[0]||{}).scroll||0));}
function dropGoalFromStacks(gid){Object.keys(UI.tabViews||{}).forEach(k=>{const st=UI.tabViews[k];
  if(Array.isArray(st))UI.tabViews[k]=st.filter(v=>!(v.name==="goal"&&v.id===gid));});}
function switchTab(id){syncStack();
  const cur=viewStack();if(cur.length)cur[cur.length-1].scroll=Math.round(window.scrollY||0);
  UI.tab=id;const st=viewStack();UI.view=st.length?st[st.length-1]:null;saveUI();render();
  requestAnimationFrame(()=>window.scrollTo(0,(st.slice(-1)[0]||{}).scroll||0));}
function isOpen(gid){return !!(UI.openGoals&&UI.openGoals[gid])||UI.openGoal===gid;}
function toggleOpen(gid){UI.openGoals=UI.openGoals||{};UI.openGoals[gid]=!isOpen(gid);if(UI.openGoals[gid])delete UI.openGoal;saveUI();}
function mondayOf(ds){const d=pdate(ds);return new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));}
function dayStat(ds){let act=0,fin=0;
  Object.values(S.tasks).forEach(t=>{if(t.deleted)return;
    if(isCyc(t)){if(taskCovers(t,ds)){markedOn(t,ds)?fin++:act++;}}
    else if(t.due===ds){t.done?fin++:act++;}});
  return{act,fin};}
function dotWrap(st){if(!st.act&&!st.fin)return'<span class="dotslot"></span>';
  return'<span class="dotslot">'+(st.act&&st.fin?'<i class="dotmix"></i>':st.act?'<i class="dotact"></i>':'<i class="dotfin"></i>')+'</span>';}
function shiftPick(k){const mode=UI.calMode||"week";
  if(k===0){UI.pick=dstr();}
  else{const p=pdate(UI.pick||dstr());
    if(mode==="week")p.setDate(p.getDate()+k*7);
    else if(mode==="month"){const day=p.getDate();p.setDate(1);p.setMonth(p.getMonth()+k);
      const last=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();p.setDate(Math.min(day,last));}
    else p.setFullYear(p.getFullYear()+k);
    UI.pick=dstr(p);}
  saveUI();render();}
function dpf(id,value,ph){return '<div class="dpf'+(value?"":" empty")+'" id="'+id+'" data-value="'+esc(value||"")+'">'+(value||esc(ph||"选择日期"))+'</div>';}
function dpVal(id){const el=document.getElementById(id);return (el&&el.dataset.value)||"";}
function dpSet(id,v){const el=document.getElementById(id);el.dataset.value=v||"";el.textContent=v||"选择日期";el.classList.toggle("empty",!v);}
function openDp(id,allowClear){
  const cur=dpVal(id)||dstr();let val=cur;let ref=val.slice(0,7);
  const draw=()=>{const [y,m]=ref.split("-").map(Number);const first=new Date(y,m-1,1);const mon0=mondayOf(dstr(first));
    let cells="";
    for(let i=0;i<42;i++){const d=new Date(mon0.getFullYear(),mon0.getMonth(),mon0.getDate()+i);const ds=dstr(d);
      cells+='<div class="cd'+(d.getMonth()!==m-1?" out":"")+(ds===val?" on":"")+(ds===dstr()?" now":"")+'" data-dpd="'+ds+'"><span>'+d.getDate()+'</span></div>';}
    $("#dp-body").innerHTML='<div class="row" style="justify-content:space-between;margin:2px 2px 8px">'+
      '<button class="circbtn" data-dpn="-1">‹</button><b>'+y+'年'+m+'月</b><button class="circbtn" data-dpn="1">›</button></div>'+
      '<div class="wdrow">'+["一","二","三","四","五","六","日"].map(w=>"<span>周"+w+"</span>").join("")+'</div><div class="calgrid">'+cells+'</div>';
    $("#dp-body").querySelectorAll("[data-dpd]").forEach(b=>b.onclick=()=>{val=b.getAttribute("data-dpd");dpSet(id,val);closeDp();});
    $("#dp-body").querySelectorAll("[data-dpn]").forEach(b=>b.onclick=()=>{const [yy,mm]=ref.split("-").map(Number);
      const nd=new Date(yy,mm-1+Number(b.getAttribute("data-dpn")),1);ref=nd.getFullYear()+"-"+String(nd.getMonth()+1).padStart(2,"0");draw();});};
  $("#dpm").innerHTML='<h3>选择日期<button class="x" id="dp-x">✕</button></h3><div id="dp-body"></div>'+
    '<div class="row mt12"><button class="btn" id="dp-today">今天</button>'+(allowClear?'<button class="btn" id="dp-clear">清除</button>':'')+'</div>';
  $("#dpwrap").classList.add("open");
  draw();
  $("#dp-x").onclick=closeDp;
  $("#dp-today").onclick=()=>{dpSet(id,dstr());closeDp();};
  if(allowClear)$("#dp-clear").onclick=()=>{dpSet(id,"");closeDp();};}
function closeDp(){$("#dpwrap").classList.remove("open");$("#dpm").innerHTML="";}
function bindDp(id,allowClear){const el=document.getElementById(id);if(el)el.onclick=()=>openDp(id,allowClear);}

/* ---------- 存储 ---------- */
const LS_STATE="okr_state_v2", LS_UI="okr_ui_v2", SY_KEY="okr_sync_v1";
const SYNC_DEFAULTS={owner:"KaraChenDS",repo:"okr-tracker-data",path:"okr.json"};
const COLL=["groups","goals","subgoals","tasks","records"];
const SG_TYPES={count:{label:"计数",icon:"⭐"},decrease:{label:"递减",icon:"↘"},percent:{label:"百分比",icon:"%"},bool:{label:"是否",icon:"✓"}};
const CONF2={high:{label:"🟢 顺利",cls:"conf-hi"},mid:{label:"🟡 有阻力",cls:"conf-mid"},low:{label:"🔴 高危",cls:"conf-lo"}};

const subsOf=g=>Object.values(S.subgoals).filter(x=>!x.deleted&&x.goalId===g).sort((a,b)=>a.createdAt-b.createdAt);
function sgType(s){return s.type||"count";}
function sgProg(s){
  const c=sgDriven(s)?sgDerived(s):Number(s.current||0), t=Math.max(1,Number(s.target||10)), st=Number(s.start||0);
  const ty=sgType(s);
  if(ty==="percent") return clamp(c,0,100);
  if(ty==="bool")    return c>=1?100:0;
  if(ty==="decrease")return (st-t)>0?clamp((st-c)/(st-t)*100,0,100):(c<=t?100:0);
  return clamp(c/t*100,0,100); /* count：driven 时 c=推进量合计 */
}
function sgDisplay(s){
  const c=sgCur(s), t=Math.max(1,Number(s.target||10)), ty=sgType(s);
  if(ty==="percent") return fmtNum(Math.round(c))+" / 100%";
  if(ty==="bool")    return c>=1?"已完成":"未完成";
  if(ty==="decrease")return fmtNum(c)+" ↘ "+fmtNum(t);
  return fmtNum(c)+"→"+fmtNum(t);
}
function sgProgAt(s,c){return sgProg(Object.assign({},s,{current:c}));}
function goalProg(gid){const ss=subsOf(gid);if(!ss.length)return 0;
  return ss.reduce((a,s)=>a+sgProg(s),0)/ss.length;}
function goalImpactPct(gid,sid,inc){
  const ss=subsOf(gid);const s=ss.find(x=>x.id===sid);if(!s)return 0;
  const ty=sgType(s);
  if(sgDriven(s)){ /* 任务驱动：一次标记对达成率的边际贡献 */
    if(ty==="count"){const tgt=Math.max(1,Number(s.target||10));return clamp(Math.min(inc,tgt-sgCur(s))/tgt*100/ss.length,0,100);}
    const exp=linkedTasks(sid).reduce((a,t)=>a+taskExpected(t),0);
    return exp>0?clamp(inc/exp*100/ss.length,0,100):0;}
  const before=sgProg(s),c=Number(s.current||0);let after=c;
  if(ty==="bool")after=1;
  else if(ty==="percent")after=Math.min(100,c+inc);
  else if(ty==="decrease")after=Math.max(Number(s.target||10),c-inc);
  else after=Math.min(Math.max(1,Number(s.target||10)),c+inc);
  return clamp((sgProg(Object.assign({},s,{current:after}))-before)/ss.length,0,100);}
function goalStatus(g){if(g.archived)return"已归档";if(!g.start||!g.end)return"未计划";const t=dstr();
  if(g.start>t)return"未开始";if(g.end<t)return"已结束";return"进行中";}
function goalPace(g){ /* v1 节奏徽章：进度 vs 时间 */
  const p=goalProg(g.id);
  if(g.archived)return{label:"已归档",cls:""};
  if(p>=99.5)return{label:"已完成",cls:"ok"};
  const st=goalStatus(g);
  if(st==="未计划")return{label:"未计划",cls:""};
  if(st==="未开始")return{label:"未开始",cls:""};
  const s=pdate(g.start),e=pdate(g.end),tp=clamp((now()-s)/((e-s)||1)*100,0,100);
  if(st==="已结束")return{label:p>=80?"已收尾":"已结束",cls:p>=80?"ok":""};
  const r=tp<=0?1:p/tp;
  if(r>=0.9)return{label:"正常",cls:"ok"};
  if(r>=0.65)return{label:"偏慢",cls:"warn"};
  return{label:"落后",cls:"bad"};}

function saveSyncCfg(c){try{localStorage.setItem(SY_KEY,JSON.stringify(c));}catch(e){}}

function syHeaders(tok){return{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};}
const b64enc=str=>{const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
function logSync(k,m){const L=JSON.parse(localStorage.getItem("okr_sync_log")||"{}");L[k]={at:now(),msg:m||""};localStorage.setItem("okr_sync_log",JSON.stringify(L));}

function stableStr(o){if(o===null||typeof o!=="object")return JSON.stringify(o);
  if(Array.isArray(o))return"["+o.map(stableStr).join(",")+"]";
  return"{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stableStr(o[k])).join(",")+"}";}
function mergeColl(a,b){const A=a||{},B=b||{},out={};
  for(const id in A)out[id]=A[id];
  for(const id in B){const x=out[id],y=B[id];if(!x||(y.updatedAt||0)>(x.updatedAt||0))out[id]=y;}
  return out;}
function dupGoalCount(st){const seen={};Object.values((st&&st.goals)||{}).forEach(g=>{if(g.deleted)return;
  seen[g.title]=(seen[g.title]||0)+1;});return Object.values(seen).filter(n=>n>1).length;}
function hasRealGoals(st){return Object.values((st&&st.goals)||{}).some(g=>!g.deleted);}
function mergeState(local,remote){const before=stableStr(local);
  const merged={v:2,meta:{updatedAt:now()}};
  COLL.forEach(k=>merged[k]=mergeColl(local[k],remote[k]));
  /* seed 防护：结果中存在任何真实目标 → 丢弃带 seed 标记的示例实体及其级联 */
  if(Object.values(merged.goals).some(g=>!g.seed)){
    const seedGoalIds=new Set(Object.keys(merged.goals).filter(k=>merged.goals[k].seed));
    Object.keys(merged.goals).forEach(k=>{if(merged.goals[k].seed)delete merged.goals[k];});
    ["subgoals","tasks","records"].forEach(c=>Object.keys(merged[c]).forEach(id=>{const x=merged[c][id];
      if(x.seed||(x.goalId&&seedGoalIds.has(x.goalId)))delete merged[c][id];}));}
  const lm=local.motto||{},rm=remote.motto||{};
  merged.motto=(rm.updatedAt||0)>(lm.updatedAt||0)?(rm.updatedAt?rm:{}):(lm.updatedAt?lm:{});
  const cnt=st=>COLL.reduce((a,k)=>a+Object.keys(st[k]||{}).length,0);
  return{merged,changed:stableStr(merged)!==before,added:cnt(merged)-cnt(local)};}
function payload(){return{app:"visokr",v:2,exportedAt:new Date().toISOString(),state:S};}
function payloadSig(src){const st=src.state||src;return stableStr(COLL.map(k=>st[k]||{}).concat([st.motto||{}]));}
function netMsg(e){const m=String((e&&e.message)||e||"");
  if(/load failed|failed to fetch|networkerror|network request failed|err_/i.test(m))
    return"连不上 api.github.com —— 网络被限制或需要代理，不是令牌问题";

function statusHint(r){if(r.status===401)return"令牌无效或已被吊销（401）：重新生成 fine-grained PAT";
  if(r.status===403)return"令牌权限不足或被限流（403）：需对数据仓库 Contents 读写";

let syncing=false;
async function syncPull(silent,replace){const c=syncCfg();
  if(!c.token){if(!silent)toast("尚未配置同步令牌");return false;}
  if(syncing)return false;syncing=true;renderSyncDot("ing");
  try{
    const r=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(r.status===404){logSync("info","云端尚无数据，正在创建");return await syncPush(silent);}
    if(!r.ok){const msg=statusHint(r)||("拉取失败 "+r.status);logSync("error",msg);if(!silent)toast(msg,3600);renderSyncDot("error");return false;}
    const j=await r.json();const remote=JSON.parse(b64dec(j.content||""));
    const rs=remote.state||remote;
    if(replace||(dupGoalCount(S)>0&&dupGoalCount(rs)===0&&hasRealGoals(rs))){
      S=rs;try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){}
      logSync("pull",replace?"replace-manual":"replace-dupes");
      if(!silent)toast(replace?"已用云端数据覆盖本机":"检测到本机数据异常（重复目标），已用云端恢复");
      render();renderSyncDot("ok");return true;}
    const{merged,changed,added}=mergeState(S,rs);
    if(changed){S=merged;try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){}
      if(added!==0&&!silent)toast(added>0?("已合并云端 "+added+" 条更新"):"云端删除已生效");render();}
    maybeSeedDemo();
    logSync("pull","ok");
    if(payloadSig({state:S})!==payloadSig(remote))return await syncPush(silent);
    renderSyncDot("ok");return true;
  }catch(e){const msg=netMsg(e);logSync("error",msg);if(!silent)toast(msg,4200);renderSyncDot("error");return false;}
  finally{syncing=false;}}
async function syncPush(silent){const c=syncCfg();if(!c.token)return false;renderSyncDot("ing");
  try{
    let sha=null;
    const g=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(g.ok){sha=(await g.json()).sha;}
    else if(g.status!==404){const msg=statusHint(g)||("读取远端失败 "+g.status);logSync("error",msg);renderSyncDot("error");return false;}
    const body={message:"sync "+new Date().toISOString(),content:b64enc(JSON.stringify(payload()))};
    if(sha)body.sha=sha;
    const r=await fetch(syncUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},syHeaders(c.token)),body:JSON.stringify(body)});
    if(!r.ok){const msg=statusHint(r)||("推送失败 "+r.status);logSync("error",msg);if(!silent)toast(msg,3800);renderSyncDot("error");return false;}
    logSync("push","ok");renderSyncDot("ok");return true;
  }catch(e){const msg=netMsg(e);logSync("error",msg);if(!silent)toast(msg,4200);renderSyncDot("error");return false;}
  finally{renderSyncDot();}}
function queuePush(){if(!syncCfg().token)return;clearTimeout(pendingTimer);pendingTimer=setTimeout(()=>{if(syncCfg().token)syncPush(true);},2500);}
function renderSyncDot(force){const el=$("#syncchip");if(!el)return;const c=syncCfg(),L=getSyncLog();

/* 目标色工具 */

function goalTaskStats(gid){const ts=Object.values(S.tasks).filter(x=>!x.deleted&&x.goalId===gid);

/* 分段圆环：每目标一段弧，弧内填充=该目标进度，中心=整体平均 */
function segRing(gs,size){size=size||78;
  const n=gs.length;if(!n)return ring(0,size);
  const w=Math.max(6,size*0.13),r=(size-w)/2,C=2*Math.PI*r;
  const gap=n>1?Math.min(5,C*0.012):0;
  let arcs="";
  gs.forEach((g,i)=>{
    const L=C/n-gap,p=clamp(goalProg(g.id),0,100),off=-(i*C/n+gap/2),c=goalColor(g);
    arcs+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:'+c+';opacity:.16" stroke-width="'+w+'" stroke-dasharray="'+L+' '+(C-L)+'" stroke-dashoffset="'+off+'"/>';
    arcs+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:'+c+'" stroke-width="'+w+'" stroke-dasharray="'+(L*p/100)+' '+(C-L*p/100)+'" stroke-dashoffset="'+off+'"/>';});
  const overall=gs.reduce((a,g)=>a+goalProg(g.id),0)/n;
  return '<span class="ring" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.28)+'px">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'+arcs+'</svg>'+
    '<span class="val"><b>'+Math.round(overall)+'</b><span style="font-size:.55em">%</span></span></span>';}
function sparkline(vals,w,h,color){w=w||110;h=h||30;
  if(vals.length<2)return '<span class="small muted">复盘 2 次后出现趋势</span>';
  const pts=vals.map((v,i)=>{const x=(i/(vals.length-1))*(w-4)+2,y=h-2-(clamp(v,0,100)/100)*(h-4);return x.toFixed(1)+","+y.toFixed(1);});
  const last=pts[pts.length-1].split(",");
  return '<svg width="'+w+'" height="'+h+'" style="vertical-align:middle">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:'+(color||"var(--accent)")+'"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" style="fill:'+(color||"var(--accent)")+'"/></svg>';}

  let cells="";const today=new Date();
  for(let i=90;i>=0;i--){const d=new Date(today.getTime()-i*864e5);const ds=dstr(d);const n=cnt[ds]||0;
    const lvl=n===0?0:Math.min(3,n);
    const bg=lvl===0?"var(--chipbg)":"color-mix(in srgb, var(--ok) "+(20+lvl*24)+"%, var(--card))";
    const ring=rev[ds]?"box-shadow:inset 0 0 0 1.6px var(--accent);":"";
    cells+='<div class="heatcell" title="'+ds+(n?" · 打卡 "+n+" 次":"")+(rev[ds]?" · 复盘 "+rev[ds]:"")+'" style="background:'+bg+';'+ring+'"></div>';}
  return '<div class="heatgrid">'+cells+'</div>';}
function markStreak(){const{cnt}=markDayCount();const set=new Set(Object.keys(cnt));
  if(!set.size)return 0;let d=new Date();if(!set.has(dstr(d)))d=new Date(d.getTime()-864e5);
  let n=0;while(set.has(dstr(d))){n++;d=new Date(d.getTime()-864e5);}return n;}
function paceSeries(){
  const cyc=Object.values(S.tasks).filter(t=>!t.deleted&&isCyc(t)&&t.origStart);
  const one=Object.values(S.tasks).filter(t=>!t.deleted&&!isCyc(t)&&t.due);
  if(!cyc.length&&!one.length)return null;
  let start=dstr();
  cyc.forEach(t=>{if(t.origStart<start)start=t.origStart;});
  one.forEach(t=>{if(t.due<start)start=t.due;});
  const floor=dstr(new Date(now()-90*864e5));if(start<floor)start=floor;
  const days=[];for(let d=pdate(start);dstr(d)<=dstr();d=new Date(d.getTime()+864e5))days.push(dstr(d));
  if(days.length<2)return null;
  const markByDay={};
  cyc.forEach(t=>taskMarks(t).forEach(m=>{const dd=markDay(m);markByDay[dd]=(markByDay[dd]||0)+1;}));
  one.forEach(t=>{if(t.done&&t.doneAt){const dd=dstr(new Date(t.doneAt));markByDay[dd]=(markByDay[dd]||0)+1;}});
  const act=[],exp=[];let ca=0;
  days.forEach(ds=>{
    ca+=markByDay[ds]||0;act.push(ca);
    let e=0;
    cyc.forEach(t=>{let n=0,cs=t.origStart;while(cs<=ds&&n<600){n++;cs=cycEnd(cs,t.cycle);}e+=n*taskQuota(t);});
    one.forEach(t=>{if(t.due<=ds)e+=1;});
    exp.push(e);});
  return{days,act,exp};}
function paceChart(){const s=paceSeries();
  if(!s||!s.exp.length||!s.exp[s.exp.length-1])return '<div class="empty small">创建周期任务后，这里对比「实际打卡 vs 推荐量」</div>';
  const W=320,H=140,P=10,n=s.days.length;
  const max=Math.max(s.exp[n-1],s.act[n-1],1);
  const xs=i=>P+i*(W-2*P)/(n-1), ys=v=>H-P-(v/max)*(H-2*P);
  const line=a=>a.map((v,i)=>xs(i).toFixed(1)+","+ys(v).toFixed(1)).join(" ");
  const area=line(s.act)+" "+xs(n-1).toFixed(1)+","+(H-P)+" "+P+","+(H-P);
  let grid="";[0.5,1].forEach(f=>{const y=(H-P-f*(H-2*P)).toFixed(1);
    grid+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-dasharray="3 4"/>';});
  const gap=s.exp[n-1]-s.act[n-1];
  const verdict=gap<=0?'<b style="color:var(--ok)">超前 '+(-gap)+' 次 💪</b>':'<b style="color:var(--warn)">欠账 '+gap+' 次</b>';
  return '<div class="trend-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+grid+
    '<polygon points="'+area+'" fill="url(#gTrend)"/>'+
    '<polyline points="'+line(s.exp)+'" fill="none" stroke-width="2" stroke-dasharray="5 5" style="stroke:var(--muted)"/>'+
    '<polyline points="'+line(s.act)+'" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--ok)"/>'+
    '<circle cx="'+xs(n-1).toFixed(1)+'" cy="'+ys(s.act[n-1]).toFixed(1)+'" r="3.6" style="fill:var(--ok)"/></svg>'+
    '<div class="trend-x"><span>'+s.days[0].slice(5).replace("-","/")+'</span><span>实际 <b style="color:var(--ok)">'+s.act[n-1]+'</b> / 推荐 '+s.exp[n-1]+' · '+verdict+'</span></div></div>';}

  else if(tab==="未计划")list=all.filter(t=>taskActive(t)&&!isCyc(t)&&!t.due);
  else list=all.filter(t=>!taskActive(t)).sort((a,b)=>taskDoneAt(b)-taskDoneAt(a));
  const groups={};
  if(tab==="未完成"){
    list.forEach(x=>{
      if(isCyc(x)){const k=x.cycleStart>t0?"之后":"今日";(groups[k]=groups[k]||[]).push(x);return;}
      const k=x.due<t0?"已逾期":x.due===t0?"今日":x.due===dstr(new Date(now()+864e5))?"明天":"之后";
      (groups[k]=groups[k]||[]).push(x);});
    Object.values(groups).forEach(arr=>arr.sort((a,b)=>(isCyc(a)?0:1)-(isCyc(b)?0:1)||String(a.time||"99").localeCompare(String(b.time||"99"))));
  }else if(tab==="已结束"){
    list.forEach(x=>{const at=taskDoneAt(x);const k=at?dstr(new Date(at)):"完成";(groups[k]=groups[k]||[]).push(x);});
  }else groups[""]=list;
  const order=tab==="未完成"?["已逾期","今日","明天","之后"]:Object.keys(groups).sort().reverse();
  return titleBar("全部任务",'<button class="circbtn" data-nav="taskmode">📅</button>')+
  '<div class="seg">'+["未完成","未计划","已结束"].map(k=>'<button data-ttab="'+k+'" class="'+(tab===k?"on":"")+'">'+k+'</button>').join("")+'</div>'+
  (order.filter(k=>groups[k]&&groups[k].length).map(k=>
    '<div class="tgroup '+(k==="已逾期"?"overdue":"")+'">'+(tab==="未完成"?k+" "+groups[k].length:(tab==="已结束"?(k===t0?"今日":relDay(k))+" "+groups[k].length:"未计划 "+groups[k].length))+(tab==="未完成"&&(k==="明天"||k==="之后")?' <span class="small muted" style="font-weight:400">（非今日，仅预览）</span>':'')+'</div>'+
    groups[k].map(x=>taskRow(x,t0,(tab==="未完成"&&(k==="明天"||k==="之后"))?"compact":"")).join("")).join("")||'<div class="card"><div class="empty">「'+tab+'」暂无任务<br><button class="btn small mt8" data-nav="add-task">＋ 去添加</button></div></div>');
}
function viewCal(){

  let cal="";

    cal='<div class="row" style="justify-content:space-between;margin:0 2px 8px">'+

      '<div class="daystrip">'+days.map(d=>{const ds=dstr(d);const st=dayStat(ds);
        return '<div class="day '+(ds===pick?"on":"")+(ds===dstr()?" now":"")+'" data-pick="'+ds+'"><div class="w">'+WD[d.getDay()]+'</div><div class="n">'+d.getDate()+'</div>'+dotWrap(st)+'</div>';}).join("")+'</div>';
  }else if(mode==="month"){
    const ref=pdate(pick);const y=ref.getFullYear(),m=ref.getMonth();
    const mon0=mondayOf(y+"-"+String(m+1).padStart(2,"0")+"-01");
    let cells="";
    for(let i=0;i<42;i++){const d=new Date(mon0.getFullYear(),mon0.getMonth(),mon0.getDate()+i);const ds=dstr(d);
      const st=dayStat(ds);
      cells+='<div class="cd'+(d.getMonth()!==m?" out":"")+(ds===pick?" on":"")+(ds===dstr()?" now":"")+'" data-pick="'+ds+'"><span>'+d.getDate()+'</span>'+dotWrap(st)+'</div>';}
    cal='<div class="row" style="justify-content:space-between;margin:0 2px 8px">'+
      '<button class="circbtn" data-calnav="-1">‹</button><b>'+(y+"年"+(m+1)+"月")+'</b><button class="circbtn" data-calnav="1">›</button></div>'+
      '<div class="wdrow">'+["一","二","三","四","五","六","日"].map(w=>"<span>周"+w+"</span>").join("")+'</div><div class="calgrid">'+cells+'</div>';
  }else{
    const y=pdate(pick).getFullYear();let months="";
    for(let m=0;m<12;m++){const mon0=mondayOf(y+"-"+String(m+1).padStart(2,"0")+"-01");
      let cells="";
      for(let i=0;i<42;i++){const d=new Date(mon0.getFullYear(),mon0.getMonth(),mon0.getDate()+i);const ds=dstr(d);
        const st=dayStat(ds);
        cells+='<div class="yd'+(d.getMonth()!==m?" out":"")+(ds===pick?" on":"")+'" data-pick="'+ds+'" title="'+ds+(st.act||st.fin?" · 待办"+st.act+" 完成"+st.fin:"")+'"><i class="'+(st.act?"sa":st.fin?"sf":"s0")+'"></i></div>';}
      months+='<div class="ym"><div class="ymt">'+(m+1)+'月</div><div class="ygrid">'+cells+'</div></div>';}
    cal='<div class="row" style="justify-content:space-between;margin:0 2px 8px">'+
      '<button class="circbtn" data-calnav="-1">‹</button><b>'+y+'年</b><button class="circbtn" data-calnav="1">›</button></div><div class="ymonths">'+months+'</div>';
  }
  const all=Object.values(S.tasks).filter(t=>!t.deleted);
  const future=pick>dstr();
  let list=all.filter(t=>taskCovers(t,pick));
  if(pick===dstr())list=list.concat(all.filter(t=>!isCyc(t)&&!t.done&&t.due&&t.due<pick));
  const actN=list.filter(t=>taskActive(t)).length;
  const body=list.length?list.map(t=>taskRow(t,pick,future?"nomark":"")).join("")
    :'<div class="card"><div class="empty">'+(future?"这天还在未来，届时再来打卡 🌱":"这天没有任务")+'<br><button class="btn small mt8" data-nav="add-task">＋ 添加任务</button></div></div>';
  return titleBar("任务日历",'<button class="circbtn" data-nav="taskmode">☰</button>')+seg+
    '<div class="card">'+cal+'<button class="btn small" data-calnav="0" style="margin-top:6px">回到今天</button></div>'+
    '<div class="tgroup">'+relDay(pick)+' · 未完成 '+actN+(future?' <span class="chip warn">未来日不可打卡</span>':'')+'</div>'+body;
}
function taskRow(t,dayCtx,mode){
  const g=t.goalId&&S.goals[t.goalId]&&!S.goals[t.goalId].deleted?S.goals[t.goalId]:null;
  const s=subOf(t);
  const imp=g&&s?goalImpactPct(g.id,s.id,t.inc||1):0;
  const c=g?goalColor(g):null;
  const cyc=isCyc(t),met=cyc&&cycMet(t),done=cyc?met:t.done;
  const ds=dayCtx||dstr();
  const dayDone=cyc&&markedOn(t,ds);
  const mk=curMarks(t).length,q=taskQuota(t);
  const mt=METRICS[taskMetric(t)]||METRICS.count;
  const compact=mode==="compact",nomark=mode==="nomark";
  /* 简化版：非今日任务只读展示，不提供打卡 */
  if(compact){
    return '<div class="task mini" data-task-open="'+t.id+'">'+
      '<span class="cb ghost"></span>'+
      '<div class="bd"><div class="tt">'+esc(t.title)+(cyc?'<span class="rep">🔁 '+REPEATS[t.cycle]+'</span>':'')+'</div>'+
      '<div class="meta">'+(t.due?WD[pdate(t.due).getDay()]+","+relDay(t.due):(cyc?"窗口 "+t.cycleStart.slice(5).replace("-","/")+" 起":"未计划"))+(g?" · "+esc(g.title):"")+'</div></div>'+
    '</div>';
  }
  const meta=[];const overdue=!cyc&&t.due&&t.due<dstr()&&!done;
  if(cyc){meta.push(REPEATS[t.cycle]+"任务·每日一次");meta.push("窗口 "+t.cycleStart.slice(5).replace("-","/")+" ~ "+cycEnd(t.cycleStart,t.cycle).slice(5).replace("-","/")+"（含前）");if(met)meta.push("本期已满 ✓");else if(dayDone)meta.push(ds===dstr()?"今日已打卡 ✓":"该日已打卡 ✓");}
  else if(t.due){meta.push(WD[pdate(t.due).getDay()]);meta.push(relDay(t.due));}
  if(done&&t.timeStart)meta.push(t.timeStart+(t.timeEnd?" - "+t.timeEnd:""));
  else if(t.time)meta.push(t.time);
  const repTag=cyc?'<span class="rep">🔁 '+REPEATS[t.cycle]+(q>1?' · '+mk+'/'+q:'')+'</span>':'';
  /* 圆圈=这一天的状态：当天打过→描边✓（目标色，非白色）；本期满额→实心✓；周进度由 🔁 x/y 徽章表达 */
  const cbInner=done||dayDone?"✓":"";
  const ringPct=cyc&&q>1?clamp(mk/q*100,0,100):-1;
  const cbWrap=(html)=>ringPct<0?html:'<span class="cbring-wrap"><svg class="cbring" width="34" height="34" viewBox="0 0 34 34" data-ring="'+ringPct.toFixed(0)+'" style="transform:rotate(-90deg)"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--chipbg)" stroke-width="3"/><circle cx="17" cy="17" r="15" fill="none" style="stroke:'+(c||"var(--purple)")+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*15*ringPct/100).toFixed(1)+' '+(2*Math.PI*15).toFixed(1)+'"/></svg>'+html+'</span>';
  let cbStyle="";
  if(c)cbStyle+="border-color:"+c+";";
  if(done)cbStyle+="background:"+(c||"var(--purple)")+";color:#fff;";
  else if(dayDone)cbStyle+="background:color-mix(in srgb,"+(c||"var(--purple)")+" 14%,var(--card));color:"+(c||"var(--purple)")+";";
  const cbHtml=cbWrap(nomark
    ?'<span class="cb" style="opacity:.4;'+cbStyle+'">'+cbInner+'</span>'
    :'<button class="cb" data-toggle="'+t.id+'"'+(cbStyle?' style="'+cbStyle+'"':'')+'>'+cbInner+'</button>');
  return '<div class="task '+(done?"done":"")+(dayDone&&!met?" todaydone":"")+'" data-task-open="'+t.id+'"'+(c&&!done?' style="background:color-mix(in srgb,'+c+' 9%,var(--card))"':'')+'>'+
    cbHtml+
    '<div class="bd"><div class="tt"'+(c&&!done?' style="color:'+c+'"':'')+'>'+esc(t.title)+repTag+'</div>'+
    (meta.length?'<div class="meta '+(overdue?"overdue":"")+'">'+meta.join(" · ")+(overdue?" · 逾期":"")+'</div>':'<div class="meta">未计划</div>')+
    (t.note?'<div class="meta">备注：'+esc(t.note)+'</div>':'')+
    (g?'<div class="link">'+esc(g.title)+(s?' / '+esc(s.title):'')+'<span class="imp">⬆ '+fmtImp(imp)+'</span></div>':'')+
    '</div>'+
    (s?'<div class="star">'+mt.icon+'<span class="badge"'+(c?' style="background:'+c+'"':'')+'>'+(taskMetric(t)==="bool"?"✓":"+"+fmtNum(t.inc||1))+'</span></div>':'')+
  '</div>';
}
function fmtImp(p){return (p>=10?Math.round(p):Math.round(p*100)/100)+"%";}

function advanceSub(s,inc,dir){ /* dir=1 完成推进, -1 撤销 */
  const ty=sgType(s);const t=Math.max(1,Number(s.target||10));let c=Number(s.current||0);
  if(ty==="bool"){s.current=dir>0?1:0;}
  else if(ty==="percent"){s.current=clamp(c+dir*inc,0,100);}
  else if(ty==="decrease"){s.current=dir>0?Math.max(Number(s.target||10),c-inc):c+inc;s.current=Math.max(0,s.current);}
  else{s.current=dir>0?Math.min(t,c+inc):Math.max(0,c-inc);}
  s.updatedAt=now();
  if(sgProg(s)>=99.5&&dir>0)toast("🎉 「"+s.title+"」达成！");}
function subOf(t){return t.subgoalId&&S.subgoals[t.subgoalId]&&!S.subgoals[t.subgoalId].deleted?S.subgoals[t.subgoalId]:null;}
/* 标记：周期任务每个自然日最多一次（marks 带 day），满额度自动完成本期 */
function markDay(m){return m.day||dstr(new Date(m.at||now()));}
function markedOn(t,ds){return taskMarks(t).some(m=>markDay(m)===ds);}
function markTask(id,day){const t=S.tasks[id];if(!t||t.deleted)return;
  const s=subOf(t);day=day||dstr();
  if(isCyc(t)){
    if(cycMet(t))return;
    if(day>dstr()){toast("未来的日子还不能打卡");return;}
    if(day<t.cycleStart||day>=cycEnd(t.cycleStart,t.cycle)){toast("这天不在本周期窗口内");return;}
    if(markedOn(t,day)){toast("这天已经打过卡啦");return;}
    if(s&&!sgDriven(s))advanceSub(s,Number(t.inc)||1,1);
    t.marks=t.marks||[];t.marks.push({at:now(),day});t.doneTotal=(Number(t.doneTotal)||0)+1;t.updatedAt=now();
    const met=cycMet(t);
    if(s&&sgDriven(s)&&sgProg(s)>=99.5)toast("🎉 「"+s.title+"」达成！");
    save();
    if(met){timeLogForm(id);}else toast("已打卡 "+day.slice(5).replace("-","/")+" · 本期 "+curMarks(t).length+"/"+taskQuota(t));
  }else{
    if(t.done)return;
    t.done=true;t.doneAt=now();t.doneTotal=1;t.updatedAt=now();
    if(s&&!sgDriven(s))advanceSub(s,Number(t.inc)||1,1);
    if(s&&sgDriven(s)&&sgProg(s)>=99.5)toast("🎉 「"+s.title+"」达成！");
    save();timeLogForm(id);}}
/* 撤销：周期任务按日撤销（默认最近一次）；driven 拆分目标由推导自动回退 */
function unmarkTask(id,day){const t=S.tasks[id];if(!t||t.deleted)return;
  const s=subOf(t);
  if(isCyc(t)){
    const cm=curMarks(t);if(!cm.length)return;
    let target=null;
    if(day)for(let i=cm.length-1;i>=0;i--)if(markDay(cm[i])===day){target=cm[i];break;}
    if(!target)target=cm[cm.length-1];
    const idx=t.marks.indexOf(target);if(idx<0)return;
    if(s&&!sgDriven(s))advanceSub(s,Number(t.inc)||1,-1);
    t.marks.splice(idx,1);t.doneTotal=Math.max(0,(Number(t.doneTotal)||taskMarks(t).length+1)-1);t.updatedAt=now();
    if(!curMarks(t).length){t.timeStart="";t.timeEnd="";}
    save();
  }else{
    if(!t.done)return;
    t.done=false;t.doneAt=null;t.doneTotal=0;t.timeStart="";t.timeEnd="";t.updatedAt=now();
    if(s&&!sgDriven(s))advanceSub(s,Number(t.inc)||1,-1);save();}}
function toggleTask(id,day){const t=S.tasks[id];if(!t)return;
  day=day||dstr();
  if(isCyc(t)){
    if(markedOn(t,day))unmarkTask(id,day);
    else if(cycMet(t))unmarkTask(id);   /* 已满且今日未打：撤销最近一次（从已结束回退） */
    else markTask(id,day);
    return;}
  if(t.done)unmarkTask(id);else markTask(id);}

function deleteGoal(id){const g=S.goals[id];if(!g||g.deleted)return;
  g.deleted=true;g.updatedAt=now();
  subsOf(id).forEach(s=>{s.deleted=true;s.updatedAt=now();});
  Object.values(S.tasks).forEach(t=>{if(!t.deleted&&t.goalId===id){t.goalId=null;t.subgoalId=null;t.updatedAt=now();}});
  Object.values(S.records).forEach(r=>{if(!r.deleted&&r.goalId===id){r.deleted=true;r.updatedAt=now();}});

/* ---------- 周时间轴拖拽改期（按住紫条左右拖，按天吸附；轻点=进详情） ---------- */
let dragState=null,dragSuppressed=false;
document.addEventListener("pointerdown",e=>{
  const bar=e.target.closest("[data-drag-goal]");if(!bar)return;
  const strip=bar.closest(".wk");if(!strip)return;
  const daysEl=strip.querySelector(".days");if(!daysEl)return;
  dragState={id:bar.getAttribute("data-drag-goal"),x0:e.clientX,colW:daysEl.getBoundingClientRect().width/9,el:bar,delta:0,moved:false};
});
document.addEventListener("pointermove",e=>{
  if(!dragState)return;
  const dx=e.clientX-dragState.x0;
  if(!dragState.moved&&Math.abs(dx)>6){dragState.moved=true;dragState.el.classList.add("dragging");}
  if(!dragState.moved)return;
  const d=Math.round(dx/dragState.colW);
  if(d!==dragState.delta){dragState.delta=d;dragState.el.style.transform="translateX("+(d*dragState.colW)+"px)";}
});
document.addEventListener("pointerup",()=>{
  if(!dragState)return;
  const st=dragState;dragState=null;
  st.el.classList.remove("dragging");
  if(st.moved){dragSuppressed=true;setTimeout(()=>dragSuppressed=false,400);}
  if(st.moved&&st.delta)shiftGoal(st.id,st.delta);
  else if(st.moved)render();
});
document.addEventListener("pointercancel",()=>{if(dragState){dragState.el.classList.remove("dragging");dragState=null;render();}});

function copyLink(){const c=syncCfg();if(!c.token){toast("请先保存令牌");return;}
  const url=location.origin+location.pathname+"#t="+encodeURIComponent(c.token);
  /* iOS 上 execCommand 会复制残留选区而非离屏 textarea 内容 → 无论 API 成败都弹出核对层，链接可见可手选 */
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        ()=>{toast("✅ 链接已复制，请在弹窗核对");copyLinkModal(url,"已复制到剪贴板（请核对下方链接完整）：");},
        ()=>copyLinkModal(url,"自动复制被系统拦截，请长按下方链接手动复制："));
      return;}
  }catch(e){}
  copyLinkModal(url,"请长按下方链接手动复制：");}
function legacyCopy(text){try{
  const ta=document.createElement("textarea");ta.value=text;ta.contentEditable="true";ta.readOnly=false;
  ta.style.cssText="position:fixed;left:-2000px;top:10px;opacity:0";
  document.body.appendChild(ta);
  const sel=window.getSelection();const range=document.createRange();
  range.selectNodeContents(ta);sel.removeAllRanges();sel.addRange(range);
  ta.setSelectionRange(0,text.length);
  let okk=false;try{okk=document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);return !!okk;}catch(e){return false;}}
function copyLinkModal(url,lead){
  openModal('<h3>连接链接<button class="x" data-act="close">✕</button></h3>'+
    '<div class="small muted mb8">'+(lead||"自动复制被浏览器拦了。")+'<b>长按输入框 → 全选 → 拷贝</b>：</div>'+
    '<input type="text" id="cl-url" value="'+esc(url)+'" style="font-size:12px" readonly>'+
    '<div class="row mt12"><button class="btn" id="cl-retry">↻ 再试一次</button><button class="btn primary" data-act="close" style="flex:1">知道了</button></div>'+
    '<div class="small muted mt8">链接含令牌，只发给自己（微信文件传输助手等），复制后建议撤回消息。</div>');
  const inp=$("#cl-url");
  const selAll=()=>{inp.removeAttribute("readonly");inp.focus();inp.setSelectionRange(0,inp.value.length);inp.setAttribute("readonly","");};
  inp.onclick=selAll;selAll();
  $("#cl-retry").onclick=()=>{legacyCopy(url)?(toast("✅ 已复制"),closeModal()):toast("仍失败，请长按输入框手动全选拷贝");};}
async function diagnose(){const box=$("#diag");if(!box)return;box.style.display="block";
  const lines=[];const push=s=>{lines.push(s);box.textContent=lines.join("\n");};
  const c=syncCfg();
  push("① 配置：owner="+c.owner+" repo="+c.repo+" path="+c.path+"，令牌"+(c.token?"已保存("+c.token.slice(0,4)+"…)":"未保存 ✗"));
  if(!c.token){push("→ 请先生成 fine-grained PAT 并保存");return;}
  push("② 连通性：GET https://api.github.com/ …");
  try{const r0=await fetch("https://api.github.com/");
    push("   任何 HTTP 响应都算通（"+r0.status+"）"+(r0.status===403?" — 常见为限流，正常":" ✓"));}
  catch(e){push("   ✗ "+netMsg(e)+"（大陆网络 api.github.com 常被单独阻断，可先手机浏览器直开验证）");return;}
  push("③ 令牌/仓库权限：GET 数据文件 …");
  try{const r=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(r.ok){const j=await r.json();push("   ✓ 文件存在 "+(j.size||0)+" 字节");}
    else if(r.status===404)push("   ✓ 令牌可用；云端尚无文件，首次推送自动创建");
    else if(r.status===401)push("   ✗ 401 令牌无效/被吊销");
    else if(r.status===403)push("   ✗ 403 权限不足（需 Contents 读写）或限流");
    else push("   ✗ HTTP "+r.status);}catch(e){push("   ✗ "+netMsg(e));}
  push("④ 建议：右上角状态点变绿即成功");}
function exportJSON(){const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="visokr-"+dstr()+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("已导出（不含令牌）");}
function importJSON(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const j=JSON.parse(rd.result);const st=j.state||j;
      if(!st.goals)throw new Error("不是 VisOKR 导出文件");
      const m=mergeState(S,st);S=m.merged;save();
      toast(m.changed?("导入合并完成（"+(m.added>0?"新增 "+m.added+" 处":"已合并")+"）"):"内容相同");
      }catch(e){toast("导入失败："+e.message,4000);}};
    rd.readAsText(f);};
  inp.click();}

/* 迁移：为无颜色的历史目标补色（一次性，不触发推送） */
(function(){let ch=false;Object.values(S.goals).forEach((g,i)=>{if(!g.deleted&&!g.color){g.color=OBJ_COLORS[i%OBJ_COLORS.length];g.updatedAt=now();ch=true;}});
  /* 旧重复任务(打勾生成制) → 周期配额模型 */
  Object.values(S.tasks).forEach(t=>{if(t.deleted||t.cycle!==undefined)return;
    if(t.repeat&&t.repeat!=="none"){
      t.cycle=t.repeat;t.cycleStart=t.due||dstr(new Date(t.createdAt||now()));t.quota=1;
      t.marks=t.done?[{at:t.doneAt||t.createdAt||now()}]:[];
      if(t.spawnedBy)t.deleted=true; /* 被生成的副本删除，父任务滚动覆盖未来 */
      delete t.repeat;delete t.seq;delete t.spawnId;ch=true;
    }else{t.cycle="none";ch=true;}});
  /* 拆分目标补 auto 开关：有关联任务且未显式设置过 → 自动计算（保持 v4.0 行为） */
  Object.values(S.subgoals).forEach(s=>{if(s.deleted||s.auto!==undefined)return;
    if(s.type!=="decrease"&&linkedTasks(s.id).length>0){s.auto=true;s.updatedAt=now();ch=true;}});
  /* 周期任务补 origStart/doneTotal（历史窗口计数与累计打卡） */
  Object.values(S.tasks).forEach(t=>{if(t.deleted||!isCyc(t))return;
    if(!t.origStart){t.origStart=t.cycleStart;ch=true;}
    if(t.doneTotal===undefined){t.doneTotal=taskMarks(t).length;ch=true;}});
  if(ch){S.meta.updatedAt=now();try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){}}})();
