<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="VisOKR：融合 Vis 的任务推进体验与 OKR 度量节奏分析——摘要、目标库、任务、我的，GitHub 多端同步。" />
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101322" media="(prefers-color-scheme: dark)" />
<title>VisOKR · 我的目标管理</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
/* ============ 主题（Vis 视觉基调：浅灰底 + 白卡 + 紫/蓝） ============ */
:root{
  --bg:#f2f3f7; --card:#ffffff; --card2:#f6f7fb; --ink:#111214; --muted:#8a8f9e;
  --line:#ececf1; --accent:#2f6bff; --purple:#8a8af0; --purple2:#7b7bea; --purple-ink:#6366f1;
  --red:#e5484d; --redbg:#fdecec; --ok:#2f9e63; --okbg:#e3f4ea; --warn:#c77701; --warnbg:#fdf1dd;
  --segbg:#e9eaf0; --chipbg:#eef0f6; --shadow:0 2px 12px rgba(25,30,60,.06); --shadow2:0 10px 30px rgba(25,30,60,.18);
  --radius:20px;
}
html[data-theme="dark"]{
  --bg:#0f1117; --card:#1a1c24; --card2:#22242e; --ink:#f2f3f7; --muted:#8f94a3;
  --line:#2a2d38; --accent:#5b8bff; --purple:#6f6fd8; --purple2:#5f5fc8; --purple-ink:#a5a8ff;
  --red:#ff6369; --redbg:#3a2226; --ok:#4ecb8a; --okbg:#16321f; --warn:#e0a94b; --warnbg:#33290f;
  --segbg:#262935; --chipbg:#242734; --shadow:0 2px 12px rgba(0,0,0,.3); --shadow2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
#app{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.page-title{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:18px 2px 16px;display:flex;align-items:center}
.page-title .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}.bold{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.backbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;color:var(--ink);margin-right:12px}
.circbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:15px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--chipbg);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--redbg);color:var(--red)}
.chip.done{background:var(--chipbg);color:var(--purple-ink)}

/* ============ 底部 Tab ============ */
#tabbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:4px;background:var(--card);border-radius:28px;box-shadow:var(--shadow2);padding:6px;width:min(430px,94vw)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border-radius:22px;font-size:11px;color:var(--ink);transition:.18s}
#tabbar button .ic{font-size:20px;line-height:1.1;filter:grayscale(1) brightness(.6)}
#tabbar button.on{background:var(--segbg);color:var(--accent);font-weight:700}
#tabbar button.on .ic{filter:none}

/* ============ 摘要 ============ */
.stats{display:flex;margin:0 4px 14px}
.stat{flex:1;text-align:center;position:relative;padding:4px 0}
.stat+.stat::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:var(--line)}
.stat .n{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.stat .n .em{font-size:17px}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.wk{position:relative;overflow:hidden}
.wk .mo{font-size:16px;font-weight:800;text-align:center;margin-bottom:8px}
.wk .days{display:grid;grid-template-columns:repeat(9,1fr);position:relative;z-index:1}
.wk .d{text-align:center;font-size:14px;font-weight:600;padding:4px 0}
.wk .d.today{color:var(--red);background:var(--redbg);border-radius:10px;font-size:12px;font-weight:700}
.wk .todayline{position:absolute;top:34px;bottom:6px;width:2px;background:var(--red);z-index:2;border-radius:2px}
.wk .bars{position:relative;margin-top:8px;display:flex;flex-direction:column;gap:10px;min-height:34px}
.gbar{height:34px;border-radius:10px;background:linear-gradient(90deg,var(--purple),var(--purple2));color:#fff;
  display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
/* 季度节奏卡 */
.qcard{display:flex;gap:16px;align-items:center}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;text-align:center;line-height:1.1}
.qmeta{flex:1;min-width:0}
.pbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--purple2));transition:width .4s}
.pbar.time>i{background:linear-gradient(90deg,#b9bec9,#8d93ab)}
.prow{display:flex;align-items:center;gap:10px}
.pct{font-size:13px;color:var(--muted);min-width:34px;text-align:right}
.chev{width:30px;height:30px;border-radius:9px;background:var(--chipbg);display:grid;place-items:center;font-size:13px;color:var(--accent)}
.riskrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.riskrow:last-child{border:none}
.sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:430px){.sg-grid{grid-template-columns:1fr}}
.sg{background:linear-gradient(160deg,var(--purple),var(--purple2));border-radius:16px;padding:14px;color:#fff;min-height:118px;
  display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow);position:relative}
.sg .t{font-size:15px;font-weight:700;line-height:1.35;flex:1}
.sg .b{display:flex;align-items:center;gap:6px;margin-top:10px}
.sg .cnt{font-size:14px;font-weight:700;flex:1;text-align:center;margin-right:6px}
.sg .plus{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px;font-weight:600;color:#fff;flex:none}
.sg .plus:active{background:rgba(255,255,255,.25)}
.sg .mini{position:absolute;top:8px;right:10px;font-size:11px;opacity:.85}
.sg .sgp{position:absolute;top:8px;left:12px;font-size:10.5px;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 6px}
.goal-card .gc-head{cursor:pointer}
.goal-card .date{font-size:12.5px;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}

/* ============ 目标库 ============ */
.grouplist .grow{display:flex;align-items:center;gap:10px;padding:15px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;font-size:16px;font-weight:700;cursor:pointer}
.grouplist .grow .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:15px}
.grouplist .grow .gt{color:var(--muted);font-size:13px}
.sect{font-size:17px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center}
.tabs{display:flex;gap:22px;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{font-size:16px;font-weight:700;position:relative;padding:6px 0;white-space:nowrap}
.tabs button .c{color:var(--muted);font-weight:600;font-size:14px}
.tabs button.on{color:var(--accent)}
.tabs button.on .c{color:var(--accent)}
.tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-10px;width:22px;height:4px;border-radius:4px;background:var(--accent)}

/* ============ 任务 ============ */
.seg{display:flex;background:var(--segbg);border-radius:14px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(20,25,50,.12);font-weight:700}
.tgroup{font-size:17px;font-weight:800;margin:16px 4px 10px}
.tgroup.overdue{color:var(--red)}
.task{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.task .cb{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--purple);flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:14px;transition:.15s}
.task.done .cb{background:var(--purple);border-color:var(--purple)}
.task .bd{flex:1;min-width:0}
.task .tt{font-size:16.5px;font-weight:700;color:var(--purple-ink);word-break:break-word}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.task .meta.overdue{color:var(--red);font-weight:700}
.task .link{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.task .imp{color:var(--purple-ink);background:var(--chipbg);border-radius:6px;padding:1px 6px;font-weight:700;display:inline-flex;gap:3px;align-items:center}
.task .star{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:24px}
.task .star .badge{position:absolute;bottom:0;right:0;background:var(--purple);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1.5px 6px;border:2px solid var(--card)}
.fab{position:fixed;right:max(20px,calc(50% - 320px + 20px));bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:50%;background:var(--card);color:var(--accent);font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:var(--shadow2)}
.fab:active{transform:scale(.94)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-align:center;padding:10px 0 12px;cursor:pointer}
.day .w{font-size:12px;color:var(--muted)}
.day .n{font-size:17px;font-weight:800;margin-top:3px;width:30px;height:30px;line-height:30px;border-radius:50%;display:inline-block}
.day.on{background:var(--chipbg)}
.day.on .w{color:var(--accent);font-weight:700}
.day.on .n{background:var(--accent);color:#fff}
.day .has{width:4px;height:4px;border-radius:50%;background:var(--purple);display:inline-block;margin:2px auto 0}

/* ============ 我的 ============ */
.vip{background:linear-gradient(120deg,#17181d,#2b2d3a);border-radius:22px;color:#fff;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.vip h4{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.vip .tag{background:#fff;color:#d9480f;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.vip p{margin:10px 0 0;font-size:13px;color:#9a9db0}
.vip .crown{position:absolute;right:14px;top:14px;font-size:52px;opacity:.18}
.setlist{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.setrow{display:flex;align-items:center;gap:12px;padding:16px;font-size:15.5px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.setlist .setrow:last-child{border-bottom:none}
.setrow .ic{font-size:19px;width:26px;text-align:center}
.setrow .arr{margin-left:auto;color:#c3c7d1;font-size:15px}
.setrow.danger{color:var(--red)}
.heatgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;max-width:320px}
.heatcell{width:12px;height:12px;border-radius:4px;background:var(--chipbg)}

/* ============ 复盘/时间线 ============ */
.tl-item{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tl-item:last-child{border:none}
.tl-date{flex:none;width:76px;font-size:12px;color:var(--muted);padding-top:2px;line-height:1.6}
.tl-body{flex:1;min-width:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.conf-hi{color:var(--ok)}.conf-mid{color:var(--warn)}.conf-lo{color:var(--red)}

/* ============ 弹层 ============ */
#overlay{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,12,20,.55);backdrop-filter:blur(2px);align-items:flex-end;justify-content:center}
@media(min-width:720px){#overlay{align-items:center}}
#overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow2)}
@media(min-width:720px){.modal{border-radius:22px}}
.modal h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center}
.modal h3 .x{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.modal h3 .x:hover{background:var(--chipbg)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2);outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:13px;background:var(--chipbg);font-size:14.5px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}
.btn.danger{color:var(--red)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.tsegs{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.tsegs button{padding:8px 12px;border-radius:11px;background:var(--chipbg);font-size:13px;color:var(--muted);font-weight:600}
.tsegs button.on{background:var(--purple);color:#fff}
.sgedit{display:flex;gap:8px;align-items:center;margin-top:8px}
.sgedit input[type=text]{flex:1}
.sgedit input[type=number]{width:76px}
.sgedit .del{color:var(--red);font-size:18px;padding:0 4px}
.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .big{font-size:36px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:13.5px;box-shadow:var(--shadow2);animation:pop .25s ease;max-width:82vw}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#syncchip{position:fixed;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:45;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;box-shadow:var(--shadow)}
#syncchip .dot{width:7px;height:7px;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#8a8af0"/><stop offset="1" style="stop-color:#6366f1"/></linearGradient>
</defs></svg>

<div id="syncchip" title="同步状态"><span class="dot" style="background:#b9bec9"></span><span class="txt">未配置同步</span></div>
<div id="app"></div>
<nav id="tabbar"></nav>
<button class="fab" id="fab" style="display:none">＋</button>
<div id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =============================================================
   VisOKR v3 · Vis 的任务推进体验 + OKR 度量节奏分析
   模型：目标 Goal → 拆分目标 Subgoal(计数/递减/百分比/是否 + 权重)
        ← 任务 Task(完成自动推进) + 复盘 Record(信心度+快照)
   存储：localStorage + GitHub Contents API 多端同步（可选）
   ============================================================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const now=()=>Date.now();
const dstr=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const pdate=s=>{if(!s)return null;const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const fmtNum=v=>(Math.round(v*100)/100).toString();
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
function ago(ts){const m=Math.floor((now()-ts)/60000);if(m<1)return"刚刚";if(m<60)return m+" 分钟前";const h=Math.floor(m/60);if(h<24)return h+" 小时前";const d=Math.floor(h/24);return d<30?d+" 天前":new Date(ts).toLocaleDateString("zh-CN");}
function toast(msg,ms){const t=$("#toast");const d=document.createElement("div");d.textContent=msg;t.appendChild(d);setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity="0";setTimeout(()=>d.remove(),320)},ms||2000);}
function relDay(ds){const t=dstr(),y=dstr(new Date(now()+864e5)),p=dstr(new Date(now()-864e5));
  return ds===t?"今天":ds===y?"明天":ds===p?"昨天":ds.slice(5).replace("-","/");}

/* ---------- 存储 ---------- */
const LS_STATE="okr_state_v2", LS_UI="okr_ui_v2", SY_KEY="okr_sync_v1";
const SYNC_DEFAULTS={owner:"KaraChenDS",repo:"okr-tracker-data",path:"okr.json"};
const COLL=["groups","goals","subgoals","tasks","records"];
const SG_TYPES={count:{label:"计数",icon:"⭐"},decrease:{label:"递减",icon:"↘"},percent:{label:"百分比",icon:"%"},bool:{label:"是否",icon:"✓"}};
const CONF2={high:{label:"🟢 顺利",cls:"conf-hi"},mid:{label:"🟡 有阻力",cls:"conf-mid"},low:{label:"🔴 高危",cls:"conf-lo"}};
function defaultState(){const s={v:2,meta:{updatedAt:now()}};COLL.forEach(k=>s[k]={});return s;}
let S=loadState(), UI=loadUI(), pendingTimer=null;
function loadState(){try{const j=JSON.parse(localStorage.getItem(LS_STATE));if(j&&j.v===2&&j.goals)return j;}catch(e){}return defaultState();}
function loadUI(){try{return JSON.parse(localStorage.getItem(LS_UI))||{};}catch(e){return{};}}
function saveUI(){try{localStorage.setItem(LS_UI,JSON.stringify(UI));}catch(e){}}
function save(opts){S.meta.updatedAt=now();
  try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){toast("本地存储失败："+e.message,3500);}
  if(!(opts&&opts.noSync))queuePush();render();}

/* ---------- 度量与节奏（v1 的 OKR 引擎） ---------- */
const subsOf=g=>Object.values(S.subgoals).filter(x=>!x.deleted&&x.goalId===g).sort((a,b)=>a.createdAt-b.createdAt);
function sgType(s){return s.type||"count";}
function sgProg(s){
  const c=Number(s.current||0), t=Math.max(1,Number(s.target||10)), st=Number(s.start||0);
  const ty=sgType(s);
  if(ty==="percent") return clamp(c,0,100);
  if(ty==="bool")    return c>=1?100:0;
  if(ty==="decrease")return (st-t)>0?clamp((st-c)/(st-t)*100,0,100):(c<=t?100:0);
  return clamp(c/t*100,0,100);
}
function sgDisplay(s){
  const c=Number(s.current||0), t=Number(s.target||10), ty=sgType(s), u=s.unit?" "+esc(s.unit):"";
  if(ty==="percent") return fmtNum(c)+"% / 100%";
  if(ty==="bool")    return c>=1?"已完成":"未完成";
  if(ty==="decrease")return fmtNum(c)+u+" ↓"+fmtNum(t)+u;
  return fmtNum(c)+"→"+fmtNum(t);
}
function sgProgAt(s,c){return sgProg(Object.assign({},s,{current:c}));}
function goalProg(gid){const ss=subsOf(gid);if(!ss.length)return 0;
  let sum=0,w=0;ss.forEach(s=>{const ww=Number(s.weight)>0?Number(s.weight):1;sum+=sgProg(s)*ww;w+=ww;});return sum/w;}
function goalWeightSum(gid){return subsOf(gid).reduce((a,s)=>a+(Number(s.weight)>0?Number(s.weight):1),0);}
function goalImpactPct(gid,sid,inc){
  const ss=subsOf(gid),W=goalWeightSum(gid);const s=ss.find(x=>x.id===sid);if(!s||!W)return 0;
  const ty=sgType(s);let d=0;
  if(ty==="percent") d=(Number(s.current||0)+inc<=100)?inc/100*100:0;
  else if(ty==="bool") d=(Number(s.current||0)<1)?100:0;
  else if(ty==="decrease"){const st=Number(s.start||0),t=Number(s.target||10);d=(st-t)>0?(inc/(st-t))*100:(Number(s.current)>t?100:0);}
  else d=(Number(s.current||0)+inc<=Math.max(1,Number(s.target||10)))?(inc/Math.max(1,Number(s.target||10)))*100:0;
  const ww=Number(s.weight)>0?Number(s.weight):1;
  return clamp(d*ww/W,0,100);}
function goalStatus(g){if(!g.start||!g.end)return"未计划";const t=dstr();
  if(g.start>t)return"未开始";if(g.end<t)return"已结束";return"进行中";}
function goalPace(g){ /* v1 节奏徽章：进度 vs 时间 */
  const p=goalProg(g.id);
  if(p>=99.5)return{label:"已完成",cls:"done"};
  const st=goalStatus(g);
  if(st==="未计划")return{label:"未计划",cls:""};
  if(st==="未开始")return{label:"未开始",cls:""};
  const s=pdate(g.start),e=pdate(g.end),tp=clamp((now()-s)/((e-s)||1)*100,0,100);
  if(st==="已结束")return{label:p>=80?"已收尾":"已结束",cls:p>=80?"ok":""};
  const r=tp<=0?1:p/tp;
  if(r>=0.9)return{label:"正常",cls:"ok"};
  if(r>=0.65)return{label:"偏慢",cls:"warn"};
  return{label:"落后",cls:"bad"};}
function lastRecord(gid){const rs=Object.values(S.records).filter(r=>!r.deleted&&r.goalId===gid);
  return rs.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)[0]||null;}
function recordStale(g){const lc=lastRecord(g.id);
  if(goalStatus(g)!=="进行中")return false;
  return !lc || dayDiff(pdate(lc.date),new Date())>8;}
const STATUS_TABS=["进行中","未计划","未开始","已结束"];
function goalsIn(gid){return Object.values(S.goals).filter(g=>!g.deleted&&(gid==null||g.groupId===gid)).sort((a,b)=>b.createdAt-a.createdAt);}
function openTasks(){return Object.values(S.tasks).filter(t=>!t.deleted&&!t.done);}
function isDone(t){return !!t.done;}
function quarterOf(d){d=d||new Date();const q=Math.floor(d.getMonth()/3)+1;const y=d.getFullYear();
  return{label:y+" Q"+q,start:y+"-"+String((q-1)*3+1).padStart(2,"0")+"-01",end:y+"-"+String(q*3).padStart(2,"0")+"-"+dstr(new Date(y,q,0)).slice(8)};}
function timeProgOf(s,e){const a=pdate(s),b=pdate(e);if(!a||!b)return 0;return clamp((now()-a)/((b-a)||1)*100,0,100);}

/* =============================================================
   同步层（已验证实现，未改动语义）
   ============================================================= */
function syncCfg(){let j={};try{j=JSON.parse(localStorage.getItem(SY_KEY))||{};}catch(e){}
  return{owner:j.owner||SYNC_DEFAULTS.owner,repo:j.repo||SYNC_DEFAULTS.repo,path:j.path||SYNC_DEFAULTS.path,token:j.token||""};}
function saveSyncCfg(c){try{localStorage.setItem(SY_KEY,JSON.stringify(c));}catch(e){}}
function syncUrl(){const s=syncCfg();
  return"https://api.github.com/repos/"+encodeURIComponent(s.owner)+"/"+encodeURIComponent(s.repo)+"/contents/"+encodeURIComponent(s.path).replace(/%2F/g,"/");}
function syHeaders(tok){return{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};}
const b64enc=str=>{const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
const b64dec=s=>{const bin=atob(s.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
function logSync(k,m){const L=JSON.parse(localStorage.getItem("okr_sync_log")||"{}");L[k]={at:now(),msg:m||""};localStorage.setItem("okr_sync_log",JSON.stringify(L));}
function getSyncLog(){try{return JSON.parse(localStorage.getItem("okr_sync_log")||"{}");}catch(e){return{};}}
function stableStr(o){if(o===null||typeof o!=="object")return JSON.stringify(o);
  if(Array.isArray(o))return"["+o.map(stableStr).join(",")+"]";
  return"{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stableStr(o[k])).join(",")+"}";}
function mergeColl(a,b){const A=a||{},B=b||{},out={};
  for(const id in A)out[id]=A[id];
  for(const id in B){const x=out[id],y=B[id];if(!x||(y.updatedAt||0)>(x.updatedAt||0))out[id]=y;}
  return out;}
function mergeState(local,remote){const before=stableStr(local);
  const merged={v:2,meta:{updatedAt:now()}};
  COLL.forEach(k=>merged[k]=mergeColl(local[k],remote[k]));
  const cnt=st=>COLL.reduce((a,k)=>a+Object.keys(st[k]||{}).length,0);
  return{merged,changed:stableStr(merged)!==before,added:cnt(merged)-cnt(local)};}
function payload(){return{app:"visokr",v:2,exportedAt:new Date().toISOString(),state:S};}
function payloadSig(src){const st=src.state||src;return stableStr(COLL.map(k=>st[k]||{}));}
function netMsg(e){const m=String((e&&e.message)||e||"");
  if(/load failed|failed to fetch|networkerror|network request failed|err_/i.test(m))
    return"连不上 api.github.com —— 网络被限制或需要代理，不是令牌问题";
  return"同步出错："+m;}
function statusHint(r){if(r.status===401)return"令牌无效或已被吊销（401）：重新生成 fine-grained PAT";
  if(r.status===403)return"令牌权限不足或被限流（403）：需对数据仓库 Contents 读写";
  if(r.status===404)return null;return"GitHub 返回 "+r.status;}
let syncing=false;
async function syncPull(silent){const c=syncCfg();
  if(!c.token){if(!silent)toast("尚未配置同步令牌");return false;}
  if(syncing)return false;syncing=true;renderSyncDot("ing");
  try{
    const r=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(r.status===404){logSync("info","云端尚无数据，正在创建");return await syncPush(silent);}
    if(!r.ok){const msg=statusHint(r)||("拉取失败 "+r.status);logSync("error",msg);if(!silent)toast(msg,3600);renderSyncDot("error");return false;}
    const j=await r.json();const remote=JSON.parse(b64dec(j.content||""));
    const{merged,changed,added}=mergeState(S,remote.state||remote);
    if(changed){S=merged;try{localStorage.setItem(LS_STATE,JSON.stringify(S));}catch(e){}
      if(added!==0&&!silent)toast(added>0?("已合并云端 "+added+" 条更新"):"云端删除已生效");render();}
    logSync("pull","ok");
    if(payloadSig({state:S})!==payloadSig(remote))return await syncPush(silent);
    renderSyncDot("ok");return true;
  }catch(e){const msg=netMsg(e);logSync("error",msg);if(!silent)toast(msg,4200);renderSyncDot("error");return false;}
  finally{syncing=false;}}
async function syncPush(silent){const c=syncCfg();if(!c.token)return false;renderSyncDot("ing");
  try{
    let sha=null;
    const g=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(g.ok){sha=(await g.json()).sha;}
    else if(g.status!==404){const msg=statusHint(g)||("读取远端失败 "+g.status);logSync("error",msg);renderSyncDot("error");return false;}
    const body={message:"sync "+new Date().toISOString(),content:b64enc(JSON.stringify(payload()))};
    if(sha)body.sha=sha;
    const r=await fetch(syncUrl(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},syHeaders(c.token)),body:JSON.stringify(body)});
    if(!r.ok){const msg=statusHint(r)||("推送失败 "+r.status);logSync("error",msg);if(!silent)toast(msg,3800);renderSyncDot("error");return false;}
    logSync("push","ok");renderSyncDot("ok");return true;
  }catch(e){const msg=netMsg(e);logSync("error",msg);if(!silent)toast(msg,4200);renderSyncDot("error");return false;}
  finally{renderSyncDot();}}
function queuePush(){if(!syncCfg().token)return;clearTimeout(pendingTimer);pendingTimer=setTimeout(()=>{if(syncCfg().token)syncPush(true);},2500);}
function renderSyncDot(force){const el=$("#syncchip");if(!el)return;const c=syncCfg(),L=getSyncLog();
  let dot="#b9bec9",txt="未配置同步";
  if(c.token){const err=L.error,lastOk=Math.max((L.pull&&L.pull.at)||0,(L.push&&L.push.at)||0);
    const errNewer=err&&err.at>lastOk;dot=errNewer?"var(--red)":"var(--ok)";
    txt=errNewer?"同步异常":("已同步 · "+ago(lastOk||now()));}
  if(force==="ing"){dot="var(--purple)";txt="同步中…";}
  if(force==="error"){dot="var(--red)";txt="同步异常";}
  el.innerHTML='<span class="dot" style="background:'+dot+';'+(force==="ing"?'animation:spin 1s linear infinite':'')+'"></span><span class="txt">'+esc(txt)+'</span>';
  el.title=(L.error&&L.error.at>Math.max((L.pull||{}).at||0,(L.push||{}).at||0))?L.error.msg:"同步状态";}
function bootstrapTokenFromHash(){const m=/[#&]t=([^&]+)/.exec(location.hash||"");if(!m)return false;
  try{const tok=decodeURIComponent(m[1]).trim();if(!tok)return false;
    saveSyncCfg(Object.assign({},syncCfg(),{token:tok}));history.replaceState(null,"",location.pathname+location.search);return true;}catch(e){return false;}}

function ring(pct,size,strokeW){size=size||44;pct=clamp(pct,0,100);
  const w=strokeW||Math.max(4,size*0.11),r=(size-w)/2,c=2*Math.PI*r,dash=c*pct/100;
  return '<span class="ring" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.3)+'px">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:var(--chipbg)" stroke-width="'+w+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="url(#ringGrad)" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+dash+' '+c+'"/>'+
    '</svg><span class="val"><b>'+Math.round(pct)+'</b><span style="font-size:.55em">%</span></span></span>';}
function sparkline(vals,w,h,color){w=w||110;h=h||30;
  if(vals.length<2)return '<span class="small muted">复盘 2 次后出现趋势</span>';
  const pts=vals.map((v,i)=>{const x=(i/(vals.length-1))*(w-4)+2,y=h-2-(clamp(v,0,100)/100)*(h-4);return x.toFixed(1)+","+y.toFixed(1);});
  const last=pts[pts.length-1].split(",");
  return '<svg width="'+w+'" height="'+h+'" style="vertical-align:middle">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:'+(color||"var(--purple)")+'"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" style="fill:'+(color||"var(--purple)")+'"/></svg>';}
function heatGrid(){
  const days={};Object.values(S.records).forEach(r=>{if(!r.deleted)days[r.date]=(days[r.date]||0)+1;});
  let cells="";const today=new Date();
  for(let i=90;i>=0;i--){const d=new Date(today.getTime()-i*864e5);const n=days[dstr(d)]||0;
    const lvl=n===0?0:Math.min(3,n);
    const bg=lvl===0?"var(--chipbg)":"color-mix(in srgb, var(--purple) "+(18+lvl*26)+"%, var(--card))";
    cells+='<div class="heatcell" title="'+dstr(d)+(n?" · "+n+" 条复盘":"")+'" style="background:'+bg+'"></div>';}
  return '<div class="heatgrid">'+cells+'</div>';}

function weekStripCard(){
  const t=new Date();const days=[];
  for(let i=-4;i<=4;i++)days.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i));
  const win={s:dstr(days[0]),e:dstr(days[8])};
  const goals=Object.values(S.goals).filter(g=>!g.deleted&&g.start&&g.end&&g.start<=win.e&&g.end>=win.s);
  const todayCol=4;
  let bars="";
  goals.slice(0,4).forEach((g,i)=>{
    let s=Math.max(0,days.findIndex(d=>dstr(d)>=g.start));
    let e=Math.min(8,days.map(dstr).filter(x=>x<=g.end).length-1);
    if(e<s)return;
    const left=s/9*100,w=(e-s+1)/9*100;
    bars+='<div style="position:absolute;left:'+left+'%;width:'+w+'%;top:'+(i*44)+'px">'+
      '<div class="gbar" data-open-goal="'+g.id+'" style="width:100%">'+esc(g.title)+'</div></div>';});
  return '<div class="card wk"><div class="mo">'+(t.getMonth()+1)+'月</div><div class="days">'+
    days.map(d=>{const ds=dstr(d);return '<div class="d '+(ds===dstr()?"today":"")+'">'+(ds===dstr()?"今天":d.getDate())+'</div>';}).join("")+
    '</div><div class="todayline" style="left:calc('+(todayCol+0.5)+'/9*100% - 1px)"></div>'+
    '<div class="bars" style="height:'+(Math.max(1,Math.min(goals.length,4))*44)+'px;position:relative">'+bars+'</div></div>';

function goalCard(g){

/* ---------- 任务 ---------- */
function viewTasks(){
  const tab=UI.ttab||"未完成";
  const all=Object.values(S.tasks).filter(t=>!t.deleted);
  let list;
  if(tab==="未完成")list=all.filter(t=>!t.done&&t.due);
  else if(tab==="未计划")list=all.filter(t=>!t.done&&!t.due);
  else list=all.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const groups={};
  if(tab==="未完成"){const t=dstr();
    list.sort((a,b)=>a.due.localeCompare(b.due));
    list.forEach(x=>{const k=x.due<t?"已逾期":x.due===t?"今日":x.due===dstr(new Date(now()+864e5))?"明天":"之后";(groups[k]=groups[k]||[]).push(x);});
  }else if(tab==="已结束"){
    list.forEach(x=>{const k=x.doneAt?dstr(new Date(x.doneAt)):"完成";(groups[k]=groups[k]||[]).push(x);});
  }else groups[""]=list;
  const order=tab==="未完成"?["已逾期","今日","明天","之后"]:Object.keys(groups).sort().reverse();
  return titleBar("全部任务",'<button class="circbtn" data-nav="today">📅</button>')+
  '<div class="seg">'+["未完成","未计划","已结束"].map(k=>'<button data-ttab="'+k+'" class="'+(tab===k?"on":"")+'">'+k+'</button>').join("")+'</div>'+
  (order.filter(k=>groups[k]&&groups[k].length).map(k=>
    '<div class="tgroup '+(k==="已逾期"?"overdue":"")+'">'+(tab==="未完成"?k+" "+groups[k].length:(tab==="已结束"?(k===dstr()?"今日":relDay(k))+" "+groups[k].length:"未计划 "+groups[k].length))+'</div>'+
    groups[k].map(taskRow).join("")).join("")||'<div class="card"><div class="empty">「'+tab+'」暂无任务<br><button class="btn small mt8" data-nav="add-task">＋ 去添加</button></div></div>');
}
function viewToday(){
  const t=new Date();const days=[];
  const mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));
  for(let i=0;i<7;i++)days.push(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i));
  UI.pick=UI.pick||dstr();
  const list=openTasks().filter(x=>x.due===UI.pick).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const doneCnt=Object.values(S.tasks).filter(x=>!x.deleted&&x.due===UI.pick&&x.done).length;
  return titleBar("今日任务",'<button class="circbtn" data-nav="all-task">☰</button>',false)+
  '<div class="daystrip">'+days.map(d=>{const ds=dstr(d);const has=Object.values(S.tasks).some(x=>!x.deleted&&x.due===ds);
    return '<div class="day '+(ds===UI.pick?"on":"")+'" data-pick="'+ds+'"><div class="w">'+WD[d.getDay()]+'</div><div class="n">'+d.getDate()+'</div>'+(has&&ds!==UI.pick?'<div class="has"></div>':'')+'</div>';}).join("")+'</div>'+
  '<div class="tgroup">未完成 '+list.length+(doneCnt?' · 已完成 '+doneCnt:'')+'</div>'+
  (list.length?list.map(taskRow).join(""):'<div class="card"><div class="empty">'+(UI.pick===dstr()?"今天没有待办，休息也是进度 🌿":"这天没有任务")+'<br><button class="btn small mt8" data-nav="add-task">＋ 添加任务</button></div></div>');
}
function taskRow(t){
  const g=t.goalId&&S.goals[t.goalId]&&!S.goals[t.goalId].deleted?S.goals[t.goalId]:null;
  const imp=g&&t.subgoalId?goalImpactPct(g.id,t.subgoalId,t.inc||1):0;
  const meta=[];const overdue=t.due&&t.due<dstr()&&!t.done;
  if(t.due){meta.push(WD[pdate(t.due).getDay()]);meta.push(relDay(t.due));if(t.time)meta.push(t.time);}
  return '<div class="task '+(t.done?"done":"")+'" data-task-open="'+t.id+'">'+
    '<button class="cb" data-toggle="'+t.id+'">'+(t.done?"✓":"")+'</button>'+
    '<div class="bd"><div class="tt">'+esc(t.title)+'</div>'+
    (meta.length?'<div class="meta '+(overdue?"overdue":"")+'">'+meta.join(",")+(overdue?" · 逾期":"")+'</div>':'<div class="meta">未计划</div>')+
    (g?'<div class="link">'+esc(g.title)+'<span class="imp">⬆ '+fmtImp(imp)+'</span></div>':'')+
    '</div>'+
    (g&&t.subgoalId?'<div class="star">⭐<span class="badge">+'+fmtNum(t.inc||1)+'</span></div>':'')+
  '</div>';
}
function fmtImp(p){return (p>=10?Math.round(p):Math.round(p*100)/100)+"%";}

function goalForm(g,preGroup){
  const isNew=!g;
  g=g||{start:dstr(),end:dstr(new Date(now()+30*864e5)),groupId:preGroup||null};
  const groups=Object.values(S.groups).filter(x=>!x.deleted);
  const subs=isNew?[{title:"",target:10}]:subsOf(g.id).map(s=>({id:s.id,title:s.title,target:s.target}));
  openModal('<h3>'+(isNew?"新建目标":"编辑目标")+'<button class="x" data-act="close">✕</button></h3>'+
    '<label class="f">目标名称</label><input type="text" id="go-title" value="'+esc(g.title||"")+'" placeholder="如 面试进展">'+
    '<div class="row" style="gap:10px"><div style="flex:1"><label class="f">开始（可留空=未计划）</label><input type="date" id="go-start" value="'+esc(g.start||"")+'"></div>'+
    '<div style="flex:1"><label class="f">结束</label><input type="date" id="go-end" value="'+esc(g.end||"")+'"></div></div>'+
    '<label class="f">目标组</label><select id="go-group"><option value="">（不分组）</option>'+groups.map(x=>'<option value="'+x.id+'" '+(x.id===g.groupId?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select>'+
    '<label class="f">拆分目标（度量类型与权重在卡片上点开细调）</label><div id="go-subs"></div>'+
    '<button class="btn small mt8" id="go-addsub">＋ 加一个拆分目标</button>'+
    '<div class="row mt12">'+(isNew?'':'<button class="btn danger" id="go-del">删除</button>')+
    '<button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="go-save" style="flex:2">保存</button></div>');
  const rowsBox=$("#go-subs");
  const renderSubs=()=>{rowsBox.innerHTML="";subs.forEach((s,i)=>{
    const d=document.createElement("div");d.className="sgedit";
    d.innerHTML='<input type="text" placeholder="如 产出作品集" value="'+esc(s.title)+'"><input type="number" min="1" step="1" value="'+(s.target||10)+'"><button class="del">✕</button>';
    const [ti,vi]=d.querySelectorAll("input");
    ti.oninput=()=>subs[i].title=ti.value;vi.oninput=()=>subs[i].target=Number(vi.value)||10;
    d.querySelector(".del").onclick=()=>{subs.splice(i,1);renderSubs();};
    rowsBox.appendChild(d);});};
  renderSubs();
  $("#go-addsub").onclick=()=>{subs.push({title:"",target:10});renderSubs();};
  $("#go-save").onclick=()=>{
    const title=$("#go-title").value.trim();if(!title){toast("名称不能为空");return;}
    const start=$("#go-start").value,end=$("#go-end").value;
    if(start&&end&&start>end){toast("结束早于开始");return;}
    const id=g.id||uid();
    const rec={id,title,start,end,groupId:$("#go-group").value||null};
    if(isNew)S.goals[id]=Object.assign(rec,{createdAt:now(),updatedAt:now(),deleted:false});
    else S.goals[id]=Object.assign(S.goals[id],rec,{updatedAt:now()});
    const keep=new Set();
    subs.forEach(s=>{if(!s.title.trim())return;keep.add(s.id);
      if(s.id&&S.subgoals[s.id])S.subgoals[s.id]=Object.assign(S.subgoals[s.id],{title:s.title.trim(),target:Number(s.target)||10,updatedAt:now()});
      else{const sid=uid();S.subgoals[sid]={id:sid,goalId:id,title:s.title.trim(),type:"count",current:0,target:Number(s.target)||10,weight:1,createdAt:now(),updatedAt:now(),deleted:false};}});
    if(!isNew)subsOf(id).forEach(s=>{if(!keep.has(s.id)){s.deleted=true;s.updatedAt=now();}});
    save();closeModal();UI.view={name:"goal",id};render();toast(isNew?"目标已创建":"已保存");};
  if(!isNew){const id0=g.id;
    $("#go-del").onclick=()=>confirmModal("删除目标「"+esc(g.title)+"」及其拆分目标？",()=>{
      S.goals[id0].deleted=true;S.goals[id0].updatedAt=now();
      subsOf(id0).forEach(s=>{s.deleted=true;s.updatedAt=now();});
      Object.values(S.tasks).forEach(t=>{if(!t.deleted&&t.goalId===id0){t.goalId=null;t.subgoalId=null;t.updatedAt=now();}});
      Object.values(S.records).forEach(r=>{if(!r.deleted&&r.goalId===id0){r.deleted=true;r.updatedAt=now();}});
      save();closeModal();UI.tab="lib";UI.view=null;render();toast("已删除");});}
}
function subForm(sid){
  const s=S.subgoals[sid];if(!s)return;
  const ty=s.type||"count";
  openModal('<h3>编辑拆分目标<button class="x" data-act="close">✕</button></h3>'+
    '<label class="f">标题</label><input type="text" id="sb-title" value="'+esc(s.title)+'">'+
    '<label class="f">度量类型</label><div class="tsegs" id="sb-types">'+
      Object.keys(SG_TYPES).map(k=>'<button data-sgt="'+k+'" class="'+(k===ty?"on":"")+'">'+SG_TYPES[k].icon+' '+SG_TYPES[k].label+'</button>').join("")+'</div>'+
    '<div class="row" style="gap:10px;flex-wrap:wrap;margin-top:4px">'+
      '<div id="sb-start-wrap" style="flex:1;min-width:120px"><label class="f">起始值</label><input type="number" step="any" id="sb-start" value="'+Number(s.start||0)+'"></div>'+
      '<div style="flex:1;min-width:120px"><label class="f">当前值</label><input type="number" step="any" id="sb-cur" value="'+Number(s.current||0)+'"></div>'+
      '<div id="sb-tgt-wrap" style="flex:1;min-width:120px"><label class="f">目标值</label><input type="number" step="any" id="sb-tgt" value="'+Number(s.target||10)+'"></div>'+
      '<div style="flex:1;min-width:100px"><label class="f">单位</label><input type="text" id="sb-unit" value="'+esc(s.unit||"")+'" placeholder="kg/本/%"></div>'+
      '<div style="flex:1;min-width:100px"><label class="f">权重</label><input type="number" min="0.5" step="0.5" id="sb-w" value="'+(Number(s.weight)||1)+'"></div>'+
    '</div>'+
    '<div class="row mt12"><button class="btn danger" id="sb-del">删除</button><button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="sb-save" style="flex:2">保存</button></div>');
  let type=ty;
  const applyType=()=>{
    $("#sb-start-wrap").style.display=type==="decrease"?"":"none";
    $("#sb-tgt-wrap").style.display=type==="bool"?"none":"";
    if(type==="percent"){$("#sb-tgt").value=100;$("#sb-cur").max=100;}
    if(type==="bool"){$("#sb-cur").min=0;$("#sb-cur").max=1;$("#sb-cur").step=1;}
    else{$("#sb-cur").min="";$("#sb-cur").max="";$("#sb-cur").step="any";}};
  applyType();
  $("#sb-types").onclick=e=>{const b=e.target.closest("[data-sgt]");if(!b)return;
    $$("#sb-types button").forEach(x=>x.classList.remove("on"));b.classList.add("on");type=b.getAttribute("data-sgt");applyType();};
  $("#sb-save").onclick=()=>{const t=$("#sb-title").value.trim();if(!t){toast("标题不能为空");return;}
    s.title=t;s.type=type;s.start=Number($("#sb-start").value)||0;s.target=type==="bool"?1:(type==="percent"?100:(Number($("#sb-tgt").value)||10));
    s.current=Number($("#sb-cur").value)||0;s.unit=$("#sb-unit").value.trim();s.weight=Math.max(0.5,Number($("#sb-w").value)||1);
    s.updatedAt=now();save();closeModal();};
  $("#sb-del").onclick=()=>{s.deleted=true;s.updatedAt=now();
    Object.values(S.tasks).forEach(x=>{if(!x.deleted&&x.subgoalId===s.id){x.subgoalId=null;x.updatedAt=now();}});
    save();closeModal();toast("已删除");};
}
function taskForm(t){
  const isNew=!t;t=t||{inc:1};
  const goals=Object.values(S.goals).filter(g=>!g.deleted);
  openModal('<h3>'+(isNew?"新建任务":"编辑任务")+'<button class="x" data-act="close">✕</button></h3>'+
    '<label class="f">任务标题</label><input type="text" id="tk-title" value="'+esc(t.title||"")+'" placeholder="如 AI agent落地流程">'+
    '<div class="row" style="gap:10px"><div style="flex:1"><label class="f">日期（留空=未计划）</label><input type="date" id="tk-due" value="'+esc(t.due||UI.pickToday||"")+'"></div>'+
    '<div style="flex:1"><label class="f">时间（可选）</label><input type="time" id="tk-time" value="'+esc(t.time||"")+'"></div></div>'+
    '<label class="f">关联目标（完成后推进拆分目标）</label><select id="tk-goal"><option value="">（不关联）</option>'+
      goals.map(g=>'<option value="'+g.id+'" '+(g.id===t.goalId?"selected":"")+'>'+esc(g.title)+'</option>').join("")+'</select>'+
    '<label class="f">推进哪个拆分目标</label><select id="tk-sub"></select>'+
    '<label class="f">完成时推进量（计数/百分比=+N，递减=−N，是否=完成）</label><input type="number" id="tk-inc" min="1" step="1" value="'+Number(t.inc||1)+'" style="width:110px">'+
    '<div class="row mt12">'+(isNew?'':'<button class="btn danger" id="tk-del">删除</button>')+
    '<button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="tk-save" style="flex:2">保存</button></div>');
  const fillSubs=()=>{const gid=$("#tk-goal").value;const ss=gid?subsOf(gid):[];
    $("#tk-sub").innerHTML=ss.length?ss.map(s=>'<option value="'+s.id+'" '+(s.id===t.subgoalId?"selected":"")+'>'+esc(s.title)+'（'+sgDisplay(s).replace(/<[^>]+>/g,"")+'）</option>').join(""):'<option value="">（先给目标加拆分目标）</option>';
    $("#tk-sub").disabled=!ss.length;};
  fillSubs();$("#tk-goal").onchange=fillSubs;
  $("#tk-save").onclick=()=>{const title=$("#tk-title").value.trim();if(!title){toast("标题不能为空");return;}
    const id=t.id||uid();
    const rec={id,title,due:$("#tk-due").value||"",time:$("#tk-time").value||"",goalId:$("#tk-goal").value||null,
      subgoalId:$("#tk-goal").value&&$("#tk-sub").value?$("#tk-sub").value:null,inc:Math.max(1,Number($("#tk-inc").value)||1)};
    if(isNew)S.tasks[id]=Object.assign(rec,{done:false,createdAt:now(),updatedAt:now(),deleted:false});
    else S.tasks[id]=Object.assign(S.tasks[id],rec,{updatedAt:now()});
    save();closeModal();toast(isNew?"任务已添加":"已保存");};
  if(!isNew)$("#tk-del").onclick=()=>{t.deleted=true;t.updatedAt=now();save();closeModal();toast("已删除");};
}
function advanceSub(s,inc,dir){ /* dir=1 完成推进, -1 撤销 */
  const ty=sgType(s);const t=Math.max(1,Number(s.target||10));let c=Number(s.current||0);
  if(ty==="bool"){s.current=dir>0?1:0;}
  else if(ty==="percent"){s.current=clamp(c+dir*inc,0,100);}
  else if(ty==="decrease"){s.current=dir>0?Math.max(Number(s.target||10),c-inc):c+inc;s.current=Math.max(0,s.current);}
  else{s.current=dir>0?Math.min(t,c+inc):Math.max(0,c-inc);}
  s.updatedAt=now();
  if(sgProg(s)>=99.5&&dir>0)toast("🎉 「"+s.title+"」达成！");}
function toggleTask(id){
  const t=S.tasks[id];if(!t||t.deleted)return;
  t.done=!t.done;t.doneAt=t.done?now():null;t.updatedAt=now();
  const s=t.subgoalId&&S.subgoals[t.subgoalId]&&!S.subgoals[t.subgoalId].deleted?S.subgoals[t.subgoalId]:null;
  if(s)advanceSub(s,Number(t.inc)||1,t.done?1:-1);
  save();}
function bumpSub(id){const s=S.subgoals[id];if(!s)return;
  advanceSub(s,1,sgType(s)==="bool"&&Number(s.current)>=1?-1:1);save();}
function recordForm(gid){
  openModal('<h3>写复盘 · '+esc(S.goals[gid].title)+'<button class="x" data-act="close">✕</button></h3>'+
    '<div class="small muted">当前进度 '+goalProg(gid).toFixed(1)+'%（保存时自动记录快照，用于趋势图）</div>'+
    '<label class="f">信心度</label><div class="tsegs" id="rc-conf">'+
      Object.keys(CONF2).map(cf=>'<button data-conf="'+cf+'" class="'+(cf==="mid"?"on":"")+'">'+CONF2[cf].label+'</button>').join("")+'</div>'+
    '<label class="f">这段时间做了什么？卡在哪？下一步？</label><textarea id="rc-text" placeholder="进展、原因、下周动作…"></textarea>'+
    '<div class="row mt12"><button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="rc-save" style="flex:2">保存</button></div>');
  let conf="mid";
  $("#rc-conf").onclick=e=>{const b=e.target.closest("[data-conf]");if(!b)return;
    $$("#rc-conf button").forEach(x=>x.classList.remove("on"));b.classList.add("on");conf=b.getAttribute("data-conf");};
  $("#rc-save").onclick=()=>{const text=$("#rc-text").value.trim();if(!text){toast("写点什么吧");return;}

    S.records[id]={id,goalId:gid,date:dstr(),text,confidence:conf,progressAt:goalProg(gid),createdAt:now(),updatedAt:now(),deleted:false};

}
function confirmModal(msg,onYes){
  openModal('<h3>确认操作<button class="x" data-act="close">✕</button></h3><div style="padding:8px 0 4px;font-size:14.5px">'+msg+'</div>'+
    '<div class="row mt12"><button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="cm-yes" style="flex:1">确认</button></div>');

document.body.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){UI.tab=tab.getAttribute("data-tab");UI.view=null;saveUI();render();return;}
  const nav=e.target.closest("[data-nav]");
  if(nav){const n=nav.getAttribute("data-nav");
    if(n==="back")UI.view=null;
    else if(n==="today")UI.view={name:"today"};
    else if(n==="all-task")UI.view=null;
    else if(n==="add-task"){taskForm();return;}
    else UI.view={name:n};
    saveUI();render();return;}
  const openG=e.target.closest("[data-open-goal]");
  if(openG){UI.tab=openG.closest(".wk")?"sum":UI.tab;UI.view={name:"goal",id:openG.getAttribute("data-open-goal")};saveUI();render();return;}
  const card=e.target.closest("[data-open-card]");
  if(card){const id=card.getAttribute("data-open-card");UI.openGoal=UI.openGoal===id?null:id;render();return;}
  const grp=e.target.closest("[data-group]");
  if(grp){UI.view={name:"group",id:grp.getAttribute("data-group")};UI.gtab="进行中";saveUI();render();return;}
  const gtab=e.target.closest("[data-gtab]");
  if(gtab){UI.gtab=gtab.getAttribute("data-gtab");render();return;}
  const ttab=e.target.closest("[data-ttab]");
  if(ttab){UI.ttab=ttab.getAttribute("data-ttab");render();return;}
  const pick=e.target.closest("[data-pick]");
  if(pick){UI.pick=pick.getAttribute("data-pick");render();return;}
  const tog=e.target.closest("[data-toggle]");
  if(tog){e.stopPropagation();toggleTask(tog.getAttribute("data-toggle"));return;}
  const bump=e.target.closest("[data-bump]");
  if(bump){e.stopPropagation();bumpSub(bump.getAttribute("data-bump"));return;}
  const esub=e.target.closest("[data-edit-sub]");
  if(esub){subForm(esub.getAttribute("data-edit-sub"));return;}
  const topen=e.target.closest("[data-task-open]");
  if(topen){taskForm(S.tasks[topen.getAttribute("data-task-open")]);return;}
  const act=e.target.closest("[data-act]");
  if(!act)return;
  const a=act.getAttribute("data-act"),id=act.getAttribute("data-id");
  switch(a){
    case"close":closeModal();break;
    case"seed":confirmModal("载入示例（面试进展）？将与现有数据共存。",()=>{S=mergeState(S,seedDemo()).merged;save();toast("示例已载入");});break;
    case"new-group":groupForm();break;
    case"new-goal":goalForm(null,act.getAttribute("data-g")||null);break;
    case"edit-goal":goalForm(S.goals[id]);break;
    case"new-sub":{const gid=id||(UI.view&&UI.view.id);
      openModal('<h3>添加拆分目标<button class="x" data-act="close">✕</button></h3>'+
        '<label class="f">标题</label><input type="text" id="ns-title" placeholder="如 产出作品集">'+
        '<label class="f">度量类型</label><div class="tsegs" id="ns-types">'+
          Object.keys(SG_TYPES).map(k=>'<button data-sgt="'+k+'" class="'+(k==="count"?"on":"")+'">'+SG_TYPES[k].icon+' '+SG_TYPES[k].label+'</button>').join("")+'</div>'+
        '<div class="row mt8" style="gap:10px"><div id="ns-start-wrap" style="flex:1;display:none"><label class="f">起始值</label><input type="number" step="any" id="ns-start" value="0"></div>'+
        '<div style="flex:1"><label class="f">目标值</label><input type="number" step="any" id="ns-tgt" value="10"></div></div>'+
        '<div class="row mt12"><button class="btn" data-act="close" style="flex:1">取消</button><button class="btn primary" id="ns-save" style="flex:2">添加</button></div>');
      let ntype="count";
      const apply=()=>{$("#ns-start-wrap").style.display=ntype==="decrease"?"block":"none";
        $("#ns-tgt").value=ntype==="percent"?100:(ntype==="bool"?1:10);};
      $("#ns-types").onclick=ev=>{const b=ev.target.closest("[data-sgt]");if(!b)return;
        $$("#ns-types button").forEach(x=>x.classList.remove("on"));b.classList.add("on");ntype=b.getAttribute("data-sgt");apply();};
      $("#ns-save").onclick=()=>{const title=$("#ns-title").value.trim();if(!title){toast("标题不能为空");return;}
        const sid=uid();S.subgoals[sid]={id:sid,goalId:gid,title,type:ntype,current:0,
          start:Number($("#ns-start").value)||0,target:ntype==="percent"?100:(ntype==="bool"?1:(Number($("#ns-tgt").value)||10)),
          weight:1,createdAt:now(),updatedAt:now(),deleted:false};
        UI.openGoal=gid;save();closeModal();toast("已添加");};break;}
    case"new-record":recordForm(id);break;
    case"del-record":{const r=S.records[id];r.deleted=true;r.updatedAt=now();save();toast("已删除");break;}
    case"theme":UI.dark=!UI.dark;applyTheme();saveUI();render();break;
    case"save-sync":saveSyncFromForm();break;
    case"pull":syncPull(false);break;
    case"push":syncPush(false);break;
    case"diagnose":diagnose();break;
    case"copy-link":copyLink();break;
    case"export":exportJSON();break;
    case"import":importJSON();break;
    case"wipe":confirmModal("清空本机全部数据？（已连接同步时，其他设备的云端副本仍在）",()=>{S=defaultState();save();UI.view=null;toast("已清空");});break;
    case"about":openModal('<h3>关于 VisOKR<button class="x" data-act="close">✕</button></h3><div class="small" style="line-height:1.8">'+
      '融合 <b>Vis</b> 的任务推进体验与 <b>OKR</b> 度量节奏分析的个人目标管理 PWA。<br>目标 → 拆分目标（⭐计数 / ↘递减 / %百分比 / ✓是否，带权重）→ 任务完成自动推进。<br>节奏引擎：进度 ÷ 时间进度 → 正常/偏慢/落后；复盘快照 → 趋势图。<br>数据：本机 localStorage + 可选 GitHub 私有仓库同步。<br>开源自用：github.com/KaraChenDS/okr-tracker</div>');break;
    case"help":openModal('<h3>帮助<button class="x" data-act="close">✕</button></h3><div class="small" style="line-height:1.9">'+
      '<b>日常推进</b>：任务打勾 → 关联拆分目标自动 +N → 目标进度上涨。<br><b>手动补记</b>：摘要页紫色卡 ＋ 按钮直接推进。<br><b>每周仪式</b>：每个目标写一条复盘（带信心度），超 8 天没写会亮「待更新」。<br><b>看节奏</b>：摘要顶部季度卡 = 总进度环 + 时间对照 + 风险清单。<br><b>多设备</b>：我的 → 多设备同步，贴一次 fine-grained PAT。<br><b>离线</b>：添加到主屏幕，无网也能记，联网后自动补传。</div>');break;
  }
});
function saveSyncFromForm(){
  const c=syncCfg();
  const owner=$("#sy-owner").value.trim(),repo=$("#sy-repo").value.trim(),path=$("#sy-path").value.trim();
  let tok=$("#sy-token").value.trim();if(!tok)tok=c.token;
  saveSyncCfg({owner,repo,path,token:tok});$("#sy-token").value="";
  toast("已保存配置，正在测试连接…");syncPull(false);
}
function copyLink(){const c=syncCfg();if(!c.token){toast("请先保存令牌");return;}
  const url=location.href.split("#")[0]+"#t="+encodeURIComponent(c.token);
  navigator.clipboard?.writeText(url).then(()=>toast("链接已复制：发给自己后记得撤回"),()=>toast("复制失败"));}
async function diagnose(){const box=$("#diag");if(!box)return;box.style.display="block";
  const lines=[];const push=s=>{lines.push(s);box.textContent=lines.join("\n");};
  const c=syncCfg();
  push("① 配置：owner="+c.owner+" repo="+c.repo+" path="+c.path+"，令牌"+(c.token?"已保存("+c.token.slice(0,4)+"…)":"未保存 ✗"));
  if(!c.token){push("→ 请先生成 fine-grained PAT 并保存");return;}
  push("② 连通性：GET https://api.github.com/ …");
  try{const r0=await fetch("https://api.github.com/");
    push("   任何 HTTP 响应都算通（"+r0.status+"）"+(r0.status===403?" — 常见为限流，正常":" ✓"));}
  catch(e){push("   ✗ "+netMsg(e)+"（大陆网络 api.github.com 常被单独阻断，可先手机浏览器直开验证）");return;}
  push("③ 令牌/仓库权限：GET 数据文件 …");
  try{const r=await fetch(syncUrl(),{headers:syHeaders(c.token)});
    if(r.ok){const j=await r.json();push("   ✓ 文件存在 "+(j.size||0)+" 字节");}
    else if(r.status===404)push("   ✓ 令牌可用；云端尚无文件，首次推送自动创建");
    else if(r.status===401)push("   ✗ 401 令牌无效/被吊销");
    else if(r.status===403)push("   ✗ 403 权限不足（需 Contents 读写）或限流");
    else push("   ✗ HTTP "+r.status);}catch(e){push("   ✗ "+netMsg(e));}
  push("④ 建议：右上角状态点变绿即成功");}
function exportJSON(){const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="visokr-"+dstr()+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("已导出（不含令牌）");}
function importJSON(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const j=JSON.parse(rd.result);const st=j.state||j;
      if(!st.goals)throw new Error("不是 VisOKR 导出文件");
      const m=mergeState(S,st);S=m.merged;save();
      toast(m.changed?("导入合并完成（"+(m.added>0?"新增 "+m.added+" 处":"已合并")+"）"):"内容相同");
      }catch(e){toast("导入失败："+e.message,4000);}};
    rd.readAsText(f);};
  inp.click();}
